<!doctype html>
<html lang="nl" data-game="decision-rush">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decision Rush — Enversed Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAFF;--ink:#16132B;--mag:#E4007C;--cy:#00A6B8;--yel:#FFD23F;--mut:#6D6A86;--rs-acc:#E4007C;--rs-on:#fff;
  font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:22px;padding:12px 24px}
h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.03em}
#round{font-size:18px;color:var(--mut);font-weight:500}
.meters{margin-left:auto;display:flex;gap:14px}
.m{width:120px}
.m span{font-size:15px;font-weight:800;display:flex;justify-content:space-between}
.m .bar{height:14px;border-radius:7px;background:#E6E4F0;overflow:hidden;margin-top:3px}
.m em{display:block;height:100%;border-radius:7px;transition:width .5s cubic-bezier(.3,1.4,.5,1),background .3s}
#score{font-size:36px;font-weight:800;min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
main{flex:1;display:grid;grid-template-rows:1fr auto;gap:12px;padding:0 24px 20px;min-height:0}
#worldWrap{position:relative;border-radius:24px;overflow:hidden;background:#BDE8F0;min-height:0}
#world{width:100%;height:100%;display:block}
#sit{position:absolute;left:24px;top:20px;right:24px;display:flex;align-items:flex-start;gap:16px}
#sit .card{background:#fff;border-radius:22px;padding:16px 22px;box-shadow:0 10px 30px rgba(22,19,43,.15);display:flex;gap:16px;align-items:center;max-width:720px}
#sit .ic{font-size:56px;line-height:1}
#sit h2{margin:0;font-size:clamp(24px,3.2vw,40px);letter-spacing:-.02em;line-height:1.05}
#clock{margin-left:auto;width:96px;height:96px;flex:none}
#conseq{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:22px;padding:18px 26px;text-align:center;max-width:620px;box-shadow:0 20px 50px rgba(22,19,43,.35)}
#conseq[hidden]{display:none}
#conseq p{margin:0 0 10px;font-size:24px;font-weight:800;line-height:1.2}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{border-radius:20px;padding:5px 12px;font-weight:800;font-size:18px}
.chip.p{background:#1FB981}.chip.n{background:var(--mag)}
#choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ch{font:inherit;font-weight:800;font-size:clamp(18px,2vw,24px);border:0;border-radius:22px;padding:22px 18px;cursor:pointer;color:#fff;display:flex;gap:14px;align-items:center;text-align:left;min-height:104px;transition:transform .1s}
.ch:active{transform:scale(.97)}
.ch span{font-size:42px}
.ch:nth-child(1){background:var(--mag)}.ch:nth-child(2){background:var(--cy)}.ch:nth-child(3){background:#6C4CF5}
.ch:disabled{opacity:.35}
button:focus-visible,a:focus-visible{outline:5px solid var(--yel);outline-offset:3px}
.overlay{position:fixed;inset:0;background:rgba(22,19,43,.92);display:grid;place-items:center;z-index:10;padding:24px;color:#fff}
.overlay[hidden]{display:none}
.box{max-width:880px;width:100%;max-height:92vh;overflow:auto}
.box h2{font-size:clamp(52px,9vw,116px);margin:0;letter-spacing:-.04em;line-height:.95}
.box p{font-size:21px;line-height:1.45;max-width:56ch}
.go{font:inherit;font-weight:800;font-size:30px;background:var(--yel);color:var(--ink);border:0;border-radius:18px;padding:16px 44px;cursor:pointer;margin-top:10px}
.big{font-size:104px;font-weight:800;letter-spacing:-.04em;line-height:1}
.fin{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.fin div{background:#2A2645;border-radius:16px;padding:12px;font-size:15px}.fin b{display:block;font-size:34px}
.log{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:15px;margin:10px 0;opacity:.9}
.log div{display:flex;gap:8px;align-items:baseline}.log i{font-style:normal;opacity:.6;white-space:nowrap}
@media (max-width:900px){#choices{grid-template-columns:1fr}.meters{display:none}.fin{grid-template-columns:1fr 1fr}.log{grid-template-columns:1fr}body{overflow:auto}#worldWrap{min-height:380px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>Decision Rush</h1><span id="round"></span><div class="meters" id="meters"></div><div id="score">0</div></header>
<main>
  <div id="worldWrap"><svg id="world" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Festivalterrein"></svg>
    <div id="sit"><div class="card"><span class="ic" id="sitIc"></span><h2 id="sitT"></h2></div>
      <svg id="clock" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff"/><circle id="clockArc" cx="50" cy="50" r="36" fill="none" stroke="#E4007C" stroke-width="14" stroke-dasharray="226" stroke-dashoffset="0" transform="rotate(-90 50 50)"/><text id="clockTxt" x="50" y="60" text-anchor="middle" font-size="28" font-weight="800" fill="#16132B" font-family="Bricolage Grotesque, sans-serif"></text></svg></div>
    <div id="conseq" hidden></div></div>
  <div id="choices"></div>
</main>
<div class="overlay" id="intro"><div class="box"><h2>Jij runt het festival.</h2><p>Twaalf situaties. Een paar seconden per keuze. Wat je kiest, zie je meteen gebeuren.</p><button class="go" id="startBtn">Poorten open</button></div></div>
<div class="overlay" id="end" hidden><div class="box" id="endBox"></div></div>
<script>// ===== Resultaten: opslaan, ranglijst en mailen (gedeeld door alle Enversed-games) =====
const RESULTS = (() => {
  const GAME = document.documentElement.dataset.game || 'game';
  const TITLE = document.title.split(' — ')[0];
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const dbP = use('db'), userP = use('user'), dlP = use('downloads');
  const LKEY = 'enversed-results-' + GAME;
  const local = {
    get() { try { return JSON.parse(localStorage.getItem(LKEY) || '[]'); } catch (e) { return []; } },
    put(a) { try { localStorage.setItem(LKEY, JSON.stringify(a.slice(-300))); } catch (e) {} }
  };
  const refs = {};   // runId -> {ref|localId}
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);

  const css = document.createElement('style');
  css.textContent = `
  .rs{margin-top:18px;padding-top:16px;border-top:2px solid rgba(127,127,127,.25);text-align:left}
  .rs h3{margin:0 0 8px;font-size:20px}
  .rs .rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rs input[type=text],.rs input[type=email]{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:2px solid rgba(127,127,127,.4);background:rgba(255,255,255,.92);color:#1b1b2b;width:100%}
  .rs label.rs-ok{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0;line-height:1.35;opacity:.9}
  .rs .rs-send{display:inline-block;font:inherit;font-weight:800;font-size:17px;text-decoration:none;padding:11px 18px;border-radius:10px;background:var(--rs-acc,#2F5BEA);color:var(--rs-on,#fff);border:0;cursor:pointer}
  .rs .rs-send[aria-disabled=true]{opacity:.45;pointer-events:none}
  .rs .rs-status{font-size:14px;margin:8px 0 0;min-height:18px;opacity:.85}
  .rs ol{padding-left:22px;margin:6px 0;font-size:16px}
  .rs ol li.me{font-weight:800}
  .rs .rs-admin{font:inherit;font-size:13px;background:none;border:1px solid rgba(127,127,127,.5);border-radius:6px;padding:5px 10px;margin-top:10px;cursor:pointer;color:inherit}
  .rs-simple .rs-row{display:flex;gap:10px;flex-wrap:wrap}
  .rs-simple .rs-row input{flex:1;min-width:220px;font-size:20px;padding:14px 16px}
  .rs-simple .rs-send{font-size:20px;padding:14px 22px}
  .rs-rank{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.rs-rank b{font-size:34px}.rs-rank span{opacity:.8}
  .rs-top{display:flex;gap:14px;list-style:decimal inside;padding:0;margin:0 0 14px;font-size:15px;opacity:.8;flex-wrap:wrap}
  .rs-outro{margin:18px 0 0;font-size:15px;line-height:1.45;opacity:.75;max-width:60ch}
  @media (max-width:560px){.rs .rs-grid{grid-template-columns:1fr}}`;
  document.head.appendChild(css);

  async function saveScore(runId, r) {
    const doc = { game: GAME, naam: r.naam || 'Anoniem', score: r.score, samenvatting: r.lines.join(' | '), at: new Date().toISOString() };
    const db = await dbP;
    if (db) {
      try {
        if (refs[runId]?.ref) { await refs[runId].ref.set(doc); }
        else { refs[runId] = { ref: await db.collection('scores').add(doc) }; }
        return 'db';
      } catch (e) { console.warn('db opslaan mislukt', e); }
    }
    const a = local.get();
    if (refs[runId]?.localId) { const i = a.findIndex(x => x.id === refs[runId].localId); if (i >= 0) a[i] = { ...doc, id: refs[runId].localId }; }
    else { const id = Date.now() + '-' + Math.random().toString(36).slice(2, 7); refs[runId] = { localId: id }; a.push({ ...doc, id }); }
    local.put(a); return 'local';
  }
  async function saveContact(r, naam, email) {
    const doc = { game: GAME, naam: naam || '', email, score: r.score, samenvatting: r.lines.join(' | '), toestemming: true, at: new Date().toISOString() };
    const db = await dbP;
    if (db) { try { await db.doc('data/contacts').collection('entries').add(doc); return true; } catch (e) { console.warn('contact niet opgeslagen', e); } }
    try { const k = LKEY + '-contacts'; const a = JSON.parse(localStorage.getItem(k) || '[]'); a.push(doc); localStorage.setItem(k, JSON.stringify(a.slice(-300))); return true; } catch (e) { return false; }
  }
  async function all() {
    const db = await dbP;
    if (db) { try { const s = await db.collection('scores').orderBy('score', 'desc').limit(1000).get(); return s.docs.map(d => ({ ...d.data(), _id: d.id })); } catch (e) {} }
    return local.get().sort((a, b) => b.score - a.score).map(x => ({ ...x, _id: x.id }));
  }
  async function top(n = 5) {
    const db = await dbP;
    if (db) { try { const s = await db.collection('scores').orderBy('score', 'desc').limit(n).get(); return s.docs.map(d => ({ ...d.data(), _id: d.id })); } catch (e) {} }
    return local.get().sort((a, b) => b.score - a.score).slice(0, n).map(x => ({ ...x, _id: x.id }));
  }
  function mailHref(email, r, naam) {
    const subject = `Jouw resultaat: ${TITLE}`;
    const body = [`Hoi${naam ? ' ' + naam : ''},`, '', `Bedankt voor het spelen van ${TITLE}. Dit is jouw resultaat:`, '', `Score: ${r.score}`, ...r.lines.map(l => '- ' + l), '', ...(r.tip ? [r.tip, ''] : []), 'Groet,', 'Enversed Studios'].join('\n');
    return `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  async function renderRank(el, runId, score) {
    const rows = await all(); if (!rows.length) { el.innerHTML = ''; return; }
    const place = rows.filter(x => x.score > score).length + 1;
    el.innerHTML = `<div class="rs-rank"><b>#${place}</b><span>van ${rows.length} ${rows.length === 1 ? 'speler' : 'spelers'}</span></div><ol class="rs-top">${rows.slice(0, 5).map(x => `<li>${x.score}</li>`).join('')}</ol>`;
  }
  async function renderBoard(el, runId) {
    const rows = await top(5);
    const mine = refs[runId]?.ref?.id || refs[runId]?.localId;
    el.innerHTML = rows.length ? `<h3>Ranglijst</h3><ol>${rows.map(x => `<li class="${x._id === mine ? 'me' : ''}">${esc(x.naam || 'Anoniem')}: ${x.score}${x._id === mine ? ' (jij)' : ''}</li>`).join('')}</ol>` : '';
  }

  async function exportCsv(btn) {
    const db = await dbP, dl = await dlP;
    let rows = [];
    if (db) { try { rows = (await db.doc('data/contacts').collection('entries').orderBy('at', 'desc').get()).docs.map(d => d.data()); } catch (e) {} }
    else { try { rows = JSON.parse(localStorage.getItem(LKEY + '-contacts') || '[]'); } catch (e) {} }
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = ['datum;naam;email;score;samenvatting', ...rows.map(r => [r.at, r.naam, r.email, r.score, r.samenvatting].map(q).join(';'))].join('\n');
    if (dl) { try { await dl.save({ filename: `${GAME}-resultaten.csv`, data: csv }); return; } catch (e) { btn.textContent = 'Download geannuleerd'; return; } }
    btn.textContent = rows.length ? `${rows.length} inzendingen (download alleen in de gepubliceerde versie)` : 'Nog geen inzendingen';
  }

  // Mount the results block into `container`. result = {score, lines:[...], tip?}; runId groups saves of one play session.
  async function mount(container, result, runId = 'run-' + Date.now(), opts = {}) {
    if (opts.simple !== false) return mountSimple(container, result, runId);
    const box = document.createElement('div'); box.className = 'rs';
    box.innerHTML = `
      <h3>Resultaat ontvangen per e-mail</h3>
      <div class="rs-grid">
        <input type="text" class="rs-name" placeholder="Je naam (voor de ranglijst)" maxlength="40" aria-label="Naam">
        <input type="email" class="rs-mail" placeholder="E-mailadres (optioneel)" aria-label="E-mailadres">
      </div>
      <label class="rs-ok"><input type="checkbox" class="rs-consent"> Ik ga akkoord dat mijn e-mailadres met mijn resultaat wordt opgeslagen door Enversed Studios.</label>
      <a class="rs-send" href="#" target="_blank" rel="noopener" aria-disabled="true">Resultaat mailen</a>
      <button type="button" class="rs-send rs-save" style="margin-left:6px;background:transparent;color:inherit;border:2px solid rgba(127,127,127,.5)">Alleen naam opslaan</button>
      <div class="rs-status" role="status"></div>
      <div class="rs-board"></div>`;
    container.appendChild(box);
    const $n = box.querySelector('.rs-name'), $m = box.querySelector('.rs-mail'), $c = box.querySelector('.rs-consent'),
          $send = box.querySelector('a.rs-send'), $save = box.querySelector('.rs-save'), $st = box.querySelector('.rs-status'), $b = box.querySelector('.rs-board');
    const refresh = () => {
      const ok = validEmail($m.value.trim()) && $c.checked;
      $send.setAttribute('aria-disabled', ok ? 'false' : 'true');
      $send.href = ok ? mailHref($m.value.trim(), result, $n.value.trim()) : '#';
    };
    [$n, $m, $c].forEach(el => el.addEventListener('input', refresh)); $c.addEventListener('change', refresh);
    const where = w => w === 'db' ? 'Opgeslagen in de gedeelde resultaten.' : 'Opgeslagen op dit apparaat.';
    // Save the score straight away (anonymous until a name is given)
    $st.textContent = 'Resultaat opslaan…';
    const w = await saveScore(runId, { ...result, naam: '' });
    $st.textContent = where(w); renderBoard($b, runId);
    $save.onclick = async () => { const w = await saveScore(runId, { ...result, naam: $n.value.trim() }); $st.textContent = where(w); renderBoard($b, runId); };
    $send.addEventListener('click', async e => {
      if ($send.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
      const email = $m.value.trim(), naam = $n.value.trim();
      // navigation to the mail app proceeds; saving runs alongside it
      saveScore(runId, { ...result, naam }).then(() => renderBoard($b, runId));
      const ok = await saveContact(result, naam, email);
      $st.textContent = ok ? `Je mailprogramma opent met je resultaat voor ${email}. Klik daar op verzenden.` : 'Je mailprogramma opent met je resultaat. Je e-mailadres kon niet worden opgeslagen.';
    });
    const user = await userP;
    if (user && user.canEdit && await user.canEdit()) {
      const b = document.createElement('button'); b.className = 'rs-admin'; b.type = 'button'; b.textContent = 'Beheer: inzendingen exporteren (CSV)';
      b.onclick = () => exportCsv(b); box.appendChild(b);
    }
  }
  async function mountSimple(container, result, runId) {
    const box = document.createElement('div'); box.className = 'rs rs-simple';
    box.innerHTML = `
      <div class="rs-rankwrap"></div>
      <div class="rs-row">
        <input type="email" class="rs-mail" placeholder="jouw@email.nl" aria-label="E-mailadres" autocomplete="email" inputmode="email">
        <a class="rs-send" href="#" target="_blank" rel="noopener" aria-disabled="true">Stuur mijn resultaat</a>
      </div>
      <label class="rs-ok"><input type="checkbox" class="rs-consent"> Enversed Studios mag mijn e-mailadres bewaren (optioneel)</label>
      <div class="rs-status" role="status"></div>
      ${result.outro ? `<p class="rs-outro">${esc(result.outro)}</p>` : ''}`;
    container.appendChild(box);
    const $m = box.querySelector('.rs-mail'), $c = box.querySelector('.rs-consent'), $send = box.querySelector('.rs-send'), $st = box.querySelector('.rs-status');
    const refresh = () => { const ok = validEmail($m.value.trim()); $send.setAttribute('aria-disabled', ok ? 'false' : 'true'); $send.href = ok ? mailHref($m.value.trim(), result, '') : '#'; };
    $m.addEventListener('input', refresh);
    $m.addEventListener('keydown', e => { if (e.key === 'Enter' && $send.getAttribute('aria-disabled') === 'false') $send.click(); });
    await saveScore(runId, { ...result, naam: '' });
    renderRank(box.querySelector('.rs-rankwrap'), runId, result.score);
    $send.addEventListener('click', async e => {
      if ($send.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
      const email = $m.value.trim();
      let kept = false; if ($c.checked) kept = await saveContact(result, '', email);
      $st.textContent = `Je mailprogramma opent met je resultaat. Klik daar op verzenden.${kept ? ' Je e-mailadres is bewaard.' : ''}`;
    });
    const user = await userP;
    if (user && user.canEdit && await user.canEdit()) { const b = document.createElement('button'); b.className = 'rs-admin'; b.type = 'button'; b.textContent = 'Beheer: inzendingen exporteren (CSV)'; b.onclick = () => exportCsv(b); box.appendChild(b); }
  }
  return { mount };
})();
</script>
<script>

  {i:'🔀',t:'Programma schuiven',e:{schema:-12,sfeer:-4},c:'Alles loopt een uur uit.'},
  {i:'🤐',t:'Niets zeggen',e:{sfeer:-12},f:{stage:0},c:'Een leeg podium en een fluitend veld.'}]},
 {ic:'📵',t:'Het mobiele netwerk valt uit',o:[

  {i:'🔒',t:'Bars sluiten',e:{budget:-12,sfeer:-10},c:'Dorst en boze gezichten.'},
  {i:'📶',t:'Wifi bij de bars',e:{budget:-8,sfeer:8},c:'Betalen werkt weer.'}]},
 {ic:'🔥',t:'Het wordt 34 graden',o:[

 {ic:'🗑️',t:'De afvalbakken puilen uit',o:[
  {i:'🧹',t:'Extra schoonmaakronde',e:{budget:-5,sfeer:4},f:{trash:0},c:'Het veld is weer schoon.'},

 {ic:'😠',t:'Ruzie bij de bar',o:[
  {i:'🦺',t:'Beveiliging erheen',e:{veilig:12,budget:-2},c:'Snel gesust.'},

];
const NONE={i:'⌛',t:'Geen beslissing',e:{sfeer:-10,veilig:-10},c:'Niemand besliste. De situatie loopt uit de hand.'};
let S, raf, t0, dur;
const $=id=>document.getElementById(id);
function ac(){ if(!ac.c){try{ac.c=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} return ac.c }
function tone(f,d=.1,t='triangle',v=.07){const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}
const val=o=>Object.values(o.e).reduce((a,b)=>a+b,0);
function meters(){ $('meters').innerHTML=MET.map(m=>{const v=S.m[m.k];return `<div class="m"><span>${m.n}<b>${Math.round(v)}</b></span><div class="bar"><em style="width:${v}%;background:${v>=60?'#1FB981':v>=35?'#FFB020':'#E4007C'}"></em></div></div>`}).join(''); }
function world(){
  const f=S.f, sf=S.m.sfeer, stormy=f.storm>0, crowdCol = sf>=60?'#1FB981':sf>=35?'#FFB020':'#E4007C';
  const crowd=[...Array(46)].map((_,i)=>{ const x=430+((i*73)%640), y=360+((i*37)%110); const hop = sf>60 ? Math.sin(Date.now()/180+i)*6 : 0; return `<circle cx="${x}" cy="${y+hop}" r="11" fill="${crowdCol}" opacity=".9"/>`; }).join('');
  const q=[...Array(f.queue*6)].map((_,i)=>`<circle cx="${70+(i%3)*22}" cy="${480-Math.floor(i/3)*22}" r="9" fill="#16132B" opacity=".75"/>`).join('');
  const trash=[...Array(f.trash)].map((_,i)=>`<g transform="translate(${360+i*60} 470)"><rect x="-16" y="-34" width="32" height="34" fill="#4A4A5A"/><ellipse cx="0" cy="-36" rx="${22+f.trash*4}" ry="12" fill="#8C8C9C"/></g>`).join('');
  const lights = f.stage ? [...Array(6)].map((_,i)=>`<path d="M${620+i*60} 110 L${560+i*80} 330 L${640+i*60} 330Z" fill="${['#E4007C','#00A6B8','#FFD23F'][i%3]}" opacity=".22"/>`).join('') : '';
  const rain = stormy ? [...Array(60)].map((_,i)=>`<line x1="${(i*97)%1200}" y1="${(i*53+Date.now()/4)%520}" x2="${(i*97)%1200-8}" y2="${(i*53+Date.now()/4)%520+22}" stroke="#DCE8F5" stroke-width="3"/>`).join('') : '';
  $('world').innerHTML = `<rect width="1200" height="520" fill="${stormy?'#5B6480':f.heat?'#FFD9A8':'#BDE8F0'}"/>${f.heat&&!stormy?'<circle cx="1080" cy="80" r="56" fill="#FFB020"/>':''}${stormy?'<path d="M900 40 l-30 70 h30 l-24 60" stroke="#FFD23F" stroke-width="8" fill="none"/>':''}
   <rect y="320" width="1200" height="200" fill="${stormy?'#557A4A':'#7CC46A'}"/>
   <rect x="560" y="90" width="460" height="240" rx="10" fill="#16132B"/><rect x="590" y="150" width="400" height="180" fill="${f.stage?'#2D2750':'#0B0918'}"/><rect x="560" y="80" width="460" height="24" fill="#E4007C"/>${lights}
   <rect x="30" y="320" width="120" height="36" fill="#6C4CF5"/><text x="90" y="345" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" font-family="Bricolage Grotesque,sans-serif">INGANG</text>${q}
   <rect x="200" y="360" width="140" height="70" rx="8" fill="#00A6B8"/><text x="270" y="402" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" font-family="Bricolage Grotesque,sans-serif">BAR</text>
   ${crowd}${trash}${rain}`;
}
function start(){
  S={i:0,m:{sfeer:60,veilig:60,budget:60,schema:60},f:{queue:1,storm:0,stage:1,heat:0,trash:1},score:0,log:[],rts:[],order:[...SIT].sort(()=>Math.random()-.5)};
  $('intro').hidden=true; $('end').hidden=true; meters(); ac(); next();
  (function anim(){ if(!S.done){ world(); requestAnimationFrame(anim);} })();
}
function next(){
  if(S.i>=S.order.length) return end();
  const s=S.order[S.i]; $('round').textContent=`Situatie ${S.i+1} van ${S.order.length}`;
  $('sitIc').textContent=s.ic; $('sitT').textContent=s.t; $('conseq').hidden=true;
  $('choices').innerHTML=s.o.map((o,j)=>`<button class="ch" data-j="${j}"><span>${o.i}</span>${o.t}</button>`).join('');
  dur = Math.max(4, 7.5 - S.i*0.3); t0=performance.now(); tone(880,.08,'square',.04);
  cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
}
function tick(n){ const p=Math.min(1,(n-t0)/1000/dur); $('clockArc').setAttribute('stroke-dashoffset', 226*p); $('clockTxt').textContent=Math.ceil(dur*(1-p)); if(p>=1) return choose(NONE,dur); raf=requestAnimationFrame(tick); }
$('choices').onclick=e=>{ const b=e.target.closest('.ch'); if(!b||b.disabled) return; choose(S.order[S.i].o[+b.dataset.j], (performance.now()-t0)/1000); };
function choose(o,rt){
  cancelAnimationFrame(raf); document.querySelectorAll('.ch').forEach(b=>b.disabled=true);
  const s=S.order[S.i];
  for(const [k,v] of Object.entries(o.e)) S.m[k]=Math.max(0,Math.min(100,S.m[k]+v));
  if(S.f.storm>0) S.f.storm--; Object.assign(S.f,o.f||{});
  const best = o!==NONE && val(o)===Math.max(...s.o.map(val));
  const pts = Math.max(0, Math.round(val(o)*6 + (o===NONE?0:(dur-rt)*15) + (best?60:0)));
  S.score+=pts; S.rts.push(rt); S.log.push({s,o,rt,best});
  meters(); $('score').textContent=S.score;
  const chips=Object.entries(o.e).filter(([,v])=>v).map(([k,v])=>`<span class="chip ${v>0?'p':'n'}">${v>0?'+':''}${v} ${MET.find(m=>m.k===k).n.split(' ')[0]}</span>`).join('');
  $('conseq').innerHTML=`<p>${o.c}</p><div class="chips">${chips||'<span class="chip p">geen effect</span>'}${best?'<span class="chip p">sterke keuze +60</span>':''}</div>`; $('conseq').hidden=false;
  val(o)>=0 ? tone(660,.12) : tone(180,.25,'sawtooth',.05);
  S.i++; setTimeout(next, 1700);
}
function end(){
  S.done=true; cancelAnimationFrame(raf);
  const bonus = Math.round(Object.values(S.m).reduce((a,b)=>a+b,0)*3); S.score+=bonus;
  const avg = S.rts.reduce((a,b)=>a+b,0)/S.rts.length, best=S.log.filter(l=>l.best).length, none=S.log.filter(l=>l.o===NONE).length;
  const lowest = MET.reduce((a,m)=>S.m[m.k]<S.m[a.k]?m:a);
  const eff = `Je festival eindigde met ${MET.map(m=>`${m.n.split(' ')[1].toLowerCase()} ${Math.round(S.m[m.k])}`).join(', ')}. ${S.m[lowest.k]<40?`${lowest.n.split(' ')[1]} kreeg het zwaarst te verduren.`:'Alles bleef in balans.'}`;
  $('endBox').innerHTML=`<h2>${S.m.veilig>=50&&S.m.sfeer>=50?'Wat een festival.':'Dat was een dag.'}</h2><div class="big">${S.score}</div>
   <div class="fin">${MET.map(m=>`<div><b>${Math.round(S.m[m.k])}</b>${m.n}</div>`).join('')}</div>
   <p>${eff} Gemiddelde reactietijd ${avg.toFixed(1)} s · ${best} sterke keuzes${none?` · ${none} keer te laat`:''}.</p>
   <div class="log">${S.log.map(l=>`<div>${l.s.ic} <span>${l.o.t}</span> <i>${l.rt.toFixed(1)}s</i></div>`).join('')}</div>
   <div id="rsSlot"></div><button class="go" id="again">Nog een festival</button>`;
  $('end').hidden=false; $('again').onclick=start;
  RESULTS.mount($('rsSlot'), {score:S.score, lines:[eff, `Gemiddelde reactietijd ${avg.toFixed(1)} seconden`, `${best} sterke keuzes van ${S.log.length}`, ...S.log.map(l=>`${l.s.t}: ${l.o.t} (${l.rt.toFixed(1)} s)`)],
    outro:'Elke keuze had een zichtbaar gevolg. Met zulke scenario\'s laat Enversed Studios mensen besluitvorming oefenen in trainingen, simulaties en serious games.'});
}
$('startBtn').onclick=start;
S={m:{sfeer:60,veilig:60,budget:60,schema:60},f:{queue:1,storm:0,stage:1,heat:0,trash:1}}; meters(); world();
</script>
