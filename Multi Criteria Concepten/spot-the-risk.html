<!doctype html>
<html lang="nl" data-game="spot-the-risk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot the Risk — Enversed Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--vis:#FF6B00;--vis2:#FFD100;--ink:#1D2A33;--wall:#C9DCE8;--ok:#1BA57A;--bad:#D93B30;--rs-acc:#FF6B00;--rs-on:#1D2A33;
  font-family:Karla,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.d{font-family:Oswald,Impact,sans-serif;font-weight:700;letter-spacing:.01em}
header{display:flex;align-items:center;gap:26px;padding:12px 24px;background:repeating-linear-gradient(-45deg,var(--vis) 0 22px,var(--vis2) 22px 44px);color:var(--ink)}
header h1{margin:0;font-size:40px;background:var(--ink);color:var(--vis2);padding:2px 14px;border-radius:6px}
.hud{margin-left:auto;display:flex;gap:14px}
.hud div{background:var(--ink);color:#fff;border-radius:10px;padding:6px 14px;text-align:center;line-height:1;min-width:92px}
.hud b{display:block;font-family:Oswald,sans-serif;font-size:34px;font-variant-numeric:tabular-nums}
.hud span{font-size:13px;opacity:.7}
#combo{color:var(--vis2)}
#time.low{color:#FF7A6E}
#stage{flex:1;position:relative;min-height:0}
svg#world{position:absolute;inset:0;width:100%;height:100%}
.it{cursor:pointer}
.it .hit{fill:transparent}
.it.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.it.fade{transition:opacity .4s;opacity:0;pointer-events:none}
.fx{pointer-events:none;font-family:Oswald,sans-serif;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(29,42,51,.93);display:grid;place-items:center;z-index:10;padding:24px}
.overlay[hidden]{display:none}
.box{max-width:860px;width:100%;max-height:92vh;overflow:auto}
.box h2{font-size:clamp(56px,9vw,120px);margin:0;line-height:.95;color:var(--vis2)}
.box p{font-size:21px;line-height:1.45;max-width:58ch}
.go{font-family:Oswald,sans-serif;font-weight:700;font-size:32px;background:var(--vis);color:var(--ink);border:0;border-radius:14px;padding:16px 46px;cursor:pointer;margin-top:10px}
button:focus-visible,a:focus-visible{outline:4px solid var(--vis2);outline-offset:3px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:18px;margin:14px 0}
.legend span{display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.stats div{background:#2B3B46;border-radius:14px;padding:14px;text-align:center;font-size:15px;opacity:.95}
.stats b{display:block;font-family:Oswald,sans-serif;font-size:46px;line-height:1.1}
.bigs{font-family:Oswald,sans-serif;font-size:110px;line-height:1;color:#fff}
.miss{display:flex;gap:8px;flex-wrap:wrap}.miss span{background:#3A2A2A;border:2px solid var(--bad);border-radius:8px;padding:6px 10px;font-size:15px}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.hud div{min-width:70px}header h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1 class="d">SPOT THE RISK</h1>
  <div class="hud"><div><b id="combo">×1</b><span>combo</span></div><div><b id="score">0</b><span>score</span></div><div><b id="time">60</b><span>sec</span></div></div></header>
<div id="stage"><svg id="world" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Werkplaats"></svg></div>
<div class="overlay" id="intro"><div class="box">
  <h2 class="d">Zie jij het gevaar?</h2>
  <p>Risico's duiken op en verdwijnen weer. Tik ze aan voordat ze weg zijn. Maar niet alles is gevaarlijk.</p>
  <div class="legend"><span>⚡ snel = bonus</span><span>🔥 op rij = combo</span><span>✋ veilig aantikken = minpunten</span></div>
  <button class="go" id="startBtn">START · 60 SEC</button></div></div>
<div class="overlay" id="end" hidden><div class="box" id="endBox"></div></div>
<script>// ===== Resultaten: opslaan, ranglijst en mailen (gedeeld door alle Enversed-games) =====
const RESULTS = (() => {
  const GAME = document.documentElement.dataset.game || 'game';
  const TITLE = document.title.split(' — ')[0];
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const dbP = use('db'), userP = use('user'), dlP = use('downloads');
  const LKEY = 'enversed-results-' + GAME;
  const local = {
    get() { try { return JSON.parse(localStorage.getItem(LKEY) || '[]'); } catch (e) { return []; } },
    put(a) { try { localStorage.setItem(LKEY, JSON.stringify(a.slice(-300))); } catch (e) {} }
  };
  const refs = {};   // runId -> {ref|localId}
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);

  const css = document.createElement('style');
  css.textContent = `
  .rs{margin-top:18px;padding-top:16px;border-top:2px solid rgba(127,127,127,.25);text-align:left}
  .rs h3{margin:0 0 8px;font-size:20px}
  .rs .rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rs input[type=text],.rs input[type=email]{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:2px solid rgba(127,127,127,.4);background:rgba(255,255,255,.92);color:#1b1b2b;width:100%}
  .rs label.rs-ok{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0;line-height:1.35;opacity:.9}
  .rs .rs-send{display:inline-block;font:inherit;font-weight:800;font-size:17px;text-decoration:none;padding:11px 18px;border-radius:10px;background:var(--rs-acc,#2F5BEA);color:var(--rs-on,#fff);border:0;cursor:pointer}
  .rs .rs-send[aria-disabled=true]{opacity:.45;pointer-events:none}
  .rs .rs-status{font-size:14px;margin:8px 0 0;min-height:18px;opacity:.85}
  .rs ol{padding-left:22px;margin:6px 0;font-size:16px}
  .rs ol li.me{font-weight:800}
  .rs .rs-admin{font:inherit;font-size:13px;background:none;border:1px solid rgba(127,127,127,.5);border-radius:6px;padding:5px 10px;margin-top:10px;cursor:pointer;color:inherit}
  .rs-simple .rs-row{display:flex;gap:10px;flex-wrap:wrap}
  .rs-simple .rs-row input{flex:1;min-width:220px;font-size:20px;padding:14px 16px}
  .rs-simple .rs-send{font-size:20px;padding:14px 22px}
  .rs-rank{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.rs-rank b{font-size:34px}.rs-rank span{opacity:.8}
  .rs-top{display:flex;gap:14px;list-style:decimal inside;padding:0;margin:0 0 14px;font-size:15px;opacity:.8;flex-wrap:wrap}
  .rs-outro{margin:18px 0 0;font-size:15px;line-height:1.45;opacity:.75;max-width:60ch}
  @media (max-width:560px){.rs .rs-grid{grid-template-columns:1fr}}`;
  document.head.appendChild(css);

  async function saveScore(runId, r) {
    const doc = { game: GAME, naam: r.naam || 'Anoniem', score: r.score, samenvatting: r.lines.join(' | '), at: new Date().toISOString() };
    const db = await dbP;
    if (db) {
      try {
        if (refs[runId]?.ref) { await refs[runId].ref.set(doc); }
        else { refs[runId] = { ref: await db.collection('scores').add(doc) }; }
        return 'db';
      } catch (e) { console.warn('db opslaan mislukt', e); }
    }
    const a = local.get();
    if (refs[runId]?.localId) { const i = a.findIndex(x => x.id === refs[runId].localId); if (i >= 0) a[i] = { ...doc, id: refs[runId].localId }; }
    else { const id = Date.now() + '-' + Math.random().toString(36).slice(2, 7); refs[runId] = { localId: id }; a.push({ ...doc, id }); }
    local.put(a); return 'local';
  }
  async function saveContact(r, naam, email) {
    const doc = { game: GAME, naam: naam || '', email, score: r.score, samenvatting: r.lines.join(' | '), toestemming: true, at: new Date().toISOString() };
    const db = await dbP;
    if (db) { try { await db.doc('data/contacts').collection('entries').add(doc); return true; } catch (e) { console.warn('contact niet opgeslagen', e); } }
    try { const k = LKEY + '-contacts'; const a = JSON.parse(localStorage.getItem(k) || '[]'); a.push(doc); localStorage.setItem(k, JSON.stringify(a.slice(-300))); return true; } catch (e) { return false; }
  }
  async function all() {
    const db = await dbP;
    if (db) { try { const s = await db.collection('scores').orderBy('score', 'desc').limit(1000).get(); return s.docs.map(d => ({ ...d.data(), _id: d.id })); } catch (e) {} }
    return local.get().sort((a, b) => b.score - a.score).map(x => ({ ...x, _id: x.id }));
  }
  async function top(n = 5) {
    const db = await dbP;
    if (db) { try { const s = await db.collection('scores').orderBy('score', 'desc').limit(n).get(); return s.docs.map(d => ({ ...d.data(), _id: d.id })); } catch (e) {} }
    return local.get().sort((a, b) => b.score - a.score).slice(0, n).map(x => ({ ...x, _id: x.id }));
  }
  function mailHref(email, r, naam) {
    const subject = `Jouw resultaat: ${TITLE}`;
    const body = [`Hoi${naam ? ' ' + naam : ''},`, '', `Bedankt voor het spelen van ${TITLE}. Dit is jouw resultaat:`, '', `Score: ${r.score}`, ...r.lines.map(l => '- ' + l), '', ...(r.tip ? [r.tip, ''] : []), 'Groet,', 'Enversed Studios'].join('\n');
    return `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  async function renderRank(el, runId, score) {
    const rows = await all(); if (!rows.length) { el.innerHTML = ''; return; }
    const place = rows.filter(x => x.score > score).length + 1;
    el.innerHTML = `<div class="rs-rank"><b>#${place}</b><span>van ${rows.length} ${rows.length === 1 ? 'speler' : 'spelers'}</span></div><ol class="rs-top">${rows.slice(0, 5).map(x => `<li>${x.score}</li>`).join('')}</ol>`;
  }
  async function renderBoard(el, runId) {
    const rows = await top(5);
    const mine = refs[runId]?.ref?.id || refs[runId]?.localId;
    el.innerHTML = rows.length ? `<h3>Ranglijst</h3><ol>${rows.map(x => `<li class="${x._id === mine ? 'me' : ''}">${esc(x.naam || 'Anoniem')}: ${x.score}${x._id === mine ? ' (jij)' : ''}</li>`).join('')}</ol>` : '';
  }

  async function exportCsv(btn) {
    const db = await dbP, dl = await dlP;
    let rows = [];
    if (db) { try { rows = (await db.doc('data/contacts').collection('entries').orderBy('at', 'desc').get()).docs.map(d => d.data()); } catch (e) {} }
    else { try { rows = JSON.parse(localStorage.getItem(LKEY + '-contacts') || '[]'); } catch (e) {} }
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = ['datum;naam;email;score;samenvatting', ...rows.map(r => [r.at, r.naam, r.email, r.score, r.samenvatting].map(q).join(';'))].join('\n');
    if (dl) { try { await dl.save({ filename: `${GAME}-resultaten.csv`, data: csv }); return; } catch (e) { btn.textContent = 'Download geannuleerd'; return; } }
    btn.textContent = rows.length ? `${rows.length} inzendingen (download alleen in de gepubliceerde versie)` : 'Nog geen inzendingen';
  }

  // Mount the results block into `container`. result = {score, lines:[...], tip?}; runId groups saves of one play session.
  async function mount(container, result, runId = 'run-' + Date.now(), opts = {}) {
    if (opts.simple !== false) return mountSimple(container, result, runId);
    const box = document.createElement('div'); box.className = 'rs';
    box.innerHTML = `
      <h3>Resultaat ontvangen per e-mail</h3>
      <div class="rs-grid">
        <input type="text" class="rs-name" placeholder="Je naam (voor de ranglijst)" maxlength="40" aria-label="Naam">
        <input type="email" class="rs-mail" placeholder="E-mailadres (optioneel)" aria-label="E-mailadres">
      </div>
      <label class="rs-ok"><input type="checkbox" class="rs-consent"> Ik ga akkoord dat mijn e-mailadres met mijn resultaat wordt opgeslagen door Enversed Studios.</label>
      <a class="rs-send" href="#" target="_blank" rel="noopener" aria-disabled="true">Resultaat mailen</a>
      <button type="button" class="rs-send rs-save" style="margin-left:6px;background:transparent;color:inherit;border:2px solid rgba(127,127,127,.5)">Alleen naam opslaan</button>
      <div class="rs-status" role="status"></div>
      <div class="rs-board"></div>`;
    container.appendChild(box);
    const $n = box.querySelector('.rs-name'), $m = box.querySelector('.rs-mail'), $c = box.querySelector('.rs-consent'),
          $send = box.querySelector('a.rs-send'), $save = box.querySelector('.rs-save'), $st = box.querySelector('.rs-status'), $b = box.querySelector('.rs-board');
    const refresh = () => {
      const ok = validEmail($m.value.trim()) && $c.checked;
      $send.setAttribute('aria-disabled', ok ? 'false' : 'true');
      $send.href = ok ? mailHref($m.value.trim(), result, $n.value.trim()) : '#';
    };
    [$n, $m, $c].forEach(el => el.addEventListener('input', refresh)); $c.addEventListener('change', refresh);
    const where = w => w === 'db' ? 'Opgeslagen in de gedeelde resultaten.' : 'Opgeslagen op dit apparaat.';
    // Save the score straight away (anonymous until a name is given)
    $st.textContent = 'Resultaat opslaan…';
    const w = await saveScore(runId, { ...result, naam: '' });
    $st.textContent = where(w); renderBoard($b, runId);
    $save.onclick = async () => { const w = await saveScore(runId, { ...result, naam: $n.value.trim() }); $st.textContent = where(w); renderBoard($b, runId); };
    $send.addEventListener('click', async e => {
      if ($send.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
      const email = $m.value.trim(), naam = $n.value.trim();
      // navigation to the mail app proceeds; saving runs alongside it
      saveScore(runId, { ...result, naam }).then(() => renderBoard($b, runId));
      const ok = await saveContact(result, naam, email);
      $st.textContent = ok ? `Je mailprogramma opent met je resultaat voor ${email}. Klik daar op verzenden.` : 'Je mailprogramma opent met je resultaat. Je e-mailadres kon niet worden opgeslagen.';
    });
    const user = await userP;
    if (user && user.canEdit && await user.canEdit()) {
      const b = document.createElement('button'); b.className = 'rs-admin'; b.type = 'button'; b.textContent = 'Beheer: inzendingen exporteren (CSV)';
      b.onclick = () => exportCsv(b); box.appendChild(b);
    }
  }
  async function mountSimple(container, result, runId) {
    const box = document.createElement('div'); box.className = 'rs rs-simple';
    box.innerHTML = `
      <div class="rs-rankwrap"></div>
      <div class="rs-row">
        <input type="email" class="rs-mail" placeholder="jouw@email.nl" aria-label="E-mailadres" autocomplete="email" inputmode="email">
        <a class="rs-send" href="#" target="_blank" rel="noopener" aria-disabled="true">Stuur mijn resultaat</a>
      </div>
      <label class="rs-ok"><input type="checkbox" class="rs-consent"> Enversed Studios mag mijn e-mailadres bewaren (optioneel)</label>
      <div class="rs-status" role="status"></div>
      ${result.outro ? `<p class="rs-outro">${esc(result.outro)}</p>` : ''}`;
    container.appendChild(box);
    const $m = box.querySelector('.rs-mail'), $c = box.querySelector('.rs-consent'), $send = box.querySelector('.rs-send'), $st = box.querySelector('.rs-status');
    const refresh = () => { const ok = validEmail($m.value.trim()); $send.setAttribute('aria-disabled', ok ? 'false' : 'true'); $send.href = ok ? mailHref($m.value.trim(), result, '') : '#'; };
    $m.addEventListener('input', refresh);
    $m.addEventListener('keydown', e => { if (e.key === 'Enter' && $send.getAttribute('aria-disabled') === 'false') $send.click(); });
    await saveScore(runId, { ...result, naam: '' });
    renderRank(box.querySelector('.rs-rankwrap'), runId, result.score);
    $send.addEventListener('click', async e => {
      if ($send.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
      const email = $m.value.trim();
      let kept = false; if ($c.checked) kept = await saveContact(result, '', email);
      $st.textContent = `Je mailprogramma opent met je resultaat. Klik daar op verzenden.${kept ? ' Je e-mailadres is bewaard.' : ''}`;
    });
    const user = await userP;
    if (user && user.canEdit && await user.canEdit()) { const b = document.createElement('button'); b.className = 'rs-admin'; b.type = 'button'; b.textContent = 'Beheer: inzendingen exporteren (CSV)'; b.onclick = () => exportCsv(b); box.appendChild(b); }
  }
  return { mount };
})();
</script>
<script>
const W=1200,H=640;
const person=(x,y,s,helm=true,extra='')=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-16" y="-58" width="32" height="46" rx="10" fill="#FF6B00"/><rect x="-16" y="-38" width="32" height="6" fill="#E9F0F3"/><rect x="-14" y="-12" width="11" height="40" rx="4" fill="#2F3E4A"/><rect x="3" y="-12" width="11" height="40" rx="4" fill="#2F3E4A"/><circle cx="0" cy="-74" r="15" fill="#E9B98F"/>${helm?'<path d="M-17 -76 a17 17 0 0 1 34 0 z" fill="#FFD100"/><rect x="-20" y="-78" width="40" height="5" rx="2" fill="#FFD100"/>':''}${extra}</g>`;
const TYPES = {
 plas:{n:'Plas op de looproute',r:(x,y,s)=>`<ellipse cx="${x}" cy="${y}" rx="${60*s}" ry="${16*s}" fill="#5DADE2" opacity=".75"/><ellipse cx="${x-15*s}" cy="${y-3*s}" rx="${18*s}" ry="${4*s}" fill="#fff" opacity=".5"/>`,
       d:(x,y,s)=>`<ellipse cx="${x}" cy="${y}" rx="${50*s}" ry="${13*s}" fill="#5DADE2" opacity=".6"/><g transform="translate(${x+50*s} ${y}) scale(${s})"><path d="M-18 0 L0 -60 L18 0 Z" fill="#FFD100" stroke="#1D2A33" stroke-width="3"/><text x="0" y="-12" text-anchor="middle" font-size="22" font-weight="700">!</text></g>`, dn:'Natte vloer, maar met bord'},
 helm:{n:'Geen helm onder de stelling',r:(x,y,s)=>person(x,y,s,false), d:(x,y,s)=>person(x,y,s,true), dn:'Collega met helm'},
 stapel:{n:'Scheve stapel pallets',r:(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})">${[0,1,2,3,4].map(i=>`<rect x="${-40+i*7}" y="${-26-i*26}" width="80" height="24" fill="#C49A5E" stroke="#8E6C3C" stroke-width="3" transform="rotate(${i*3} 0 ${-i*26})"/>`).join('')}</g>`,
         d:(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})">${[0,1,2].map(i=>`<rect x="-40" y="${-26-i*26}" width="80" height="24" fill="#C49A5E" stroke="#8E6C3C" stroke-width="3"/>`).join('')}</g>`, dn:'Nette, lage stapel'},
 kabel:{n:'Beschadigde kabel over de vloer',r:(x,y,s)=>`<path d="M${x-80*s} ${y} q${40*s} ${-20*s} ${80*s} 0 t${80*s} 0" stroke="#1D2A33" stroke-width="${7*s}" fill="none"/><g fill="#FFD100"><path d="M${x} ${y-4} l${6*s} ${-18*s} l${-2*s} ${10*s} l${8*s} ${-3*s} l${-10*s} ${20*s}"/></g><circle cx="${x+4}" cy="${y-6}" r="${10*s}" fill="#FFD100" opacity=".35"/>`,
        d:(x,y,s)=>`<rect x="${x-90*s}" y="${y-10*s}" width="${180*s}" height="${16*s}" rx="${8*s}" fill="#FFD100" stroke="#1D2A33" stroke-width="3"/><path d="M${x-80*s} ${y-2*s} h${160*s}" stroke="#1D2A33" stroke-width="3" stroke-dasharray="10 8"/>`, dn:'Kabel onder een kabelgoot'},
 ladder:{n:'Ladder op losse kratten',r:(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-40" y="-40" width="80" height="40" fill="#6B8E23"/><rect x="-30" y="-78" width="60" height="38" fill="#7FA83A"/><g stroke="#AAB5BD" stroke-width="6"><line x1="-18" y1="-78" x2="-6" y2="-210"/><line x1="18" y1="-78" x2="26" y2="-210"/>${[0,1,2,3].map(i=>`<line x1="${-16+i*3}" y1="${-100-i*28}" x2="${19+i*2}" y2="${-100-i*28}"/>`).join('')}</g></g>`,
         d:(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})" stroke="#AAB5BD" stroke-width="6"><line x1="-20" y1="0" x2="-8" y2="-150"/><line x1="20" y1="0" x2="8" y2="-150"/>${[0,1,2,3].map(i=>`<line x1="${-18+i*3}" y1="${-26-i*32}" x2="${18-i*3}" y2="${-26-i*32}"/>`).join('')}</g>`, dn:'Ladder stevig op de vloer'},
 heftruck:{n:'Heftruck rijdt op iemand af',r:(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-70" y="-60" width="80" height="50" rx="8" fill="#FFB400"/><rect x="-60" y="-100" width="46" height="42" fill="none" stroke="#1D2A33" stroke-width="5"/><rect x="10" y="-110" width="8" height="100" fill="#555"/><rect x="18" y="-18" width="50" height="7" fill="#555"/><circle cx="-50" cy="-8" r="14" fill="#1D2A33"/><circle cx="-4" cy="-8" r="14" fill="#1D2A33"/><path d="M28 -70 h26 l-8 -8 m8 8 l-8 8" stroke="#D93B30" stroke-width="5" fill="none"/></g>${person(x+95*s,y,s*.9,true)}`,
           d:(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-70" y="-60" width="80" height="50" rx="8" fill="#FFB400"/><rect x="-60" y="-100" width="46" height="42" fill="none" stroke="#1D2A33" stroke-width="5"/><rect x="10" y="-110" width="8" height="100" fill="#555"/><rect x="18" y="-8" width="50" height="7" fill="#555"/><circle cx="-50" cy="-8" r="14" fill="#1D2A33"/><circle cx="-4" cy="-8" r="14" fill="#1D2A33"/><text x="-35" y="-72" text-anchor="middle" font-size="22" font-weight="700" fill="#1D2A33">P</text></g>`, dn:'Geparkeerde heftruck'},
 roken:{n:'Roken naast brandbare vaten',r:(x,y,s)=>`${drums(x,y,s)}${person(x+80*s,y,s,true,'<rect x="10" y="-72" width="18" height="4" fill="#fff"/><circle cx="30" cy="-70" r="3" fill="#FF6B00"/><path d="M30 -76 q6 -10 0 -20 q-6 -10 2 -18" stroke="#BBB" stroke-width="3" fill="none"/>')}`,
        d:(x,y,s)=>`${drums(x,y,s)}${person(x+80*s,y,s,true,'<rect x="10" y="-60" width="14" height="18" rx="3" fill="#fff"/>')}`, dn:'Collega met koffie bij de vaten'},
 kast:{n:'Open elektrakast',r:(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-40" y="-120" width="80" height="120" fill="#8FA3B0"/><rect x="-36" y="-116" width="72" height="112" fill="#2F3E4A"/><path d="M40 -120 l40 14 v112 l-40 -6z" fill="#A9BAC5"/><path d="M-6 -90 l14 0 l-10 26 l14 0 l-22 36 l6 -26 l-12 0z" fill="#FFD100"/></g>`,
       d:(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-40" y="-120" width="80" height="120" fill="#8FA3B0"/><rect x="18" y="-66" width="10" height="16" rx="2" fill="#1D2A33"/><path d="M-10 -96 l10 0 l-6 16 l10 0 l-14 22 l4 -16 l-8 0z" fill="#FFD100" stroke="#1D2A33" stroke-width="2"/></g>`, dn:'Gesloten, vergrendelde kast'},
 uitgang:{n:'Nooduitgang geblokkeerd',r:(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})">${[[-60,0],[0,0],[-30,-40],[30,-40],[0,-80]].map(([a,b])=>`<rect x="${a-30}" y="${b-40}" width="60" height="40" fill="#C49A5E" stroke="#8E6C3C" stroke-width="3"/>`).join('')}</g>`,
          d:(x,y,s)=>`<g transform="translate(${x+120*s} ${y}) scale(${s})"><rect x="-30" y="-40" width="60" height="40" fill="#C49A5E" stroke="#8E6C3C" stroke-width="3"/></g>`, dn:'Doos naast de uitgang, route vrij'}
};
function drums(x,y,s){ return `<g transform="translate(${x} ${y}) scale(${s})">${[-26,26].map(a=>`<rect x="${a-22}" y="-70" width="44" height="70" rx="6" fill="#2E86C1"/><rect x="${a-22}" y="-50" width="44" height="5" fill="#1D5F8A"/><rect x="${a-22}" y="-25" width="44" height="5" fill="#1D5F8A"/>`).join('')}<path d="M-8 -60 l8 -14 l8 14z" fill="#FFD100" stroke="#1D2A33" stroke-width="2"/></g>`; }
const ANCH = [
 {x:260,y:560,t:['plas','kabel','helm']},{x:520,y:590,t:['plas','kabel','heftruck']},{x:820,y:570,t:['plas','helm','roken']},
 {x:150,y:420,t:['stapel','ladder','helm']},{x:420,y:420,t:['helm','stapel','roken']},{x:680,y:430,t:['stapel','kast','ladder']},
 {x:960,y:440,t:['helm','kast','heftruck']},{x:1080,y:600,t:['uitgang']},{x:340,y:300,t:['kast','helm']},{x:880,y:300,t:['stapel','helm']}
];
const bg = `<rect width="${W}" height="${H}" fill="#C9DCE8"/><rect y="330" width="${W}" height="310" fill="#9AA7B2"/>
 ${[80,380,640,900].map(x=>`<g stroke="#2F6690" stroke-width="10"><line x1="${x}" y1="80" x2="${x}" y2="330"/><line x1="${x+200}" y1="80" x2="${x+200}" y2="330"/><line x1="${x}" y1="170" x2="${x+200}" y2="170"/><line x1="${x}" y1="250" x2="${x+200}" y2="250"/></g><rect x="${x+20}" y="120" width="70" height="46" fill="#C49A5E"/><rect x="${x+110}" y="200" width="70" height="46" fill="#B8894F"/>`).join('')}
 <path d="M0 500 H${W}" stroke="#FFD100" stroke-width="8" stroke-dasharray="40 26"/><path d="M0 620 H${W}" stroke="#FFD100" stroke-width="8" stroke-dasharray="40 26"/>
 <rect x="1040" y="360" width="120" height="240" fill="#1BA57A"/><rect x="1060" y="330" width="80" height="26" rx="4" fill="#1BA57A"/><text x="1100" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">EXIT</text>`;
let S, raf, last;
const $=id=>document.getElementById(id);
function ac(){ if(!ac.c){try{ac.c=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} return ac.c }
function tone(f,d=.1,t='square',v=.05){const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}

function start(){
  S={t:0,score:0,streak:0,items:[],next:1,id:0,found:0,missed:0,wrong:0,rts:[],missedTypes:{},over:false};
  $('intro').hidden=true; $('end').hidden=true;
  $('world').innerHTML = bg + '<g id="items"></g><g id="fx"></g>';
  ac(); last=performance.now(); raf=requestAnimationFrame(loop);
}
function spawn(){
  const busy=new Set(S.items.map(i=>i.a));
  const free=ANCH.map((a,i)=>i).filter(i=>!busy.has(i)); if(!free.length) return;
  const ai=free[Math.floor(Math.random()*free.length)], a=ANCH[ai];
  const type=a.t[Math.floor(Math.random()*a.t.length)];
  const phase=S.t/60, risky=Math.random()<.68;
  const subtle = phase>.4 && Math.random()<.5;
  const s = (subtle?.72:1) * (a.y<350?.8:1);
  const it={id:++S.id,a:ai,type,risky,born:S.t,life:Math.max(3.6,7-phase*3.4)*(subtle?1.1:1),s,subtle};
  S.items.push(it);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','it pop'); g.id='i'+it.id; g.style.transformOrigin=`${a.x}px ${a.y}px`;
  if(subtle) g.style.opacity=.82;
  g.innerHTML = (risky?TYPES[type].r:TYPES[type].d)(a.x,a.y,s) + `<circle class="hit" cx="${a.x}" cy="${a.y-60*s}" r="${95*s}"/>`;
  g.addEventListener('pointerdown',()=>hit(it));
  $('items').appendChild(g);
}
function fx(x,y,txt,col){ const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('class','fx'); t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','40'); t.setAttribute('fill',col); t.setAttribute('stroke','#1D2A33'); t.setAttribute('stroke-width','2'); t.textContent=txt; $('fx').appendChild(t);
  const t0=performance.now(); (function a(n){ const p=(n-t0)/800; t.setAttribute('y',y-p*60); t.setAttribute('opacity',1-p); if(p<1) requestAnimationFrame(a); else t.remove(); })(t0); }
function removeItem(it,fade=true){ S.items=S.items.filter(x=>x!==it); const g=$('i'+it.id); if(!g) return; if(fade){ g.classList.add('fade'); setTimeout(()=>g.remove(),400);} else g.remove(); }
function hit(it){
  if(S.over||!S.items.includes(it)) return;
  const a=ANCH[it.a], age=S.t-it.born;
  if(it.risky){
    S.found++; S.rts.push(age); S.streak++;
    const mult=Math.min(3,1+S.streak*.2), speed=age<1.5?60:age<3?25:0;
    const pts=Math.round((100+speed+(it.subtle?40:0))*mult); S.score+=pts;
    fx(a.x,a.y-120*it.s,`+${pts}${speed>=60?' ⚡':''}`,'#FFD100'); tone(700+Math.min(8,S.streak)*80,.08); 
    removeItem(it,false); ring(a.x,a.y-60*it.s,'#1BA57A');
  } else {
    S.wrong++; S.streak=0; S.score=Math.max(0,S.score-50);
    fx(a.x,a.y-120*it.s,'Veilig! −50','#FF7A6E'); tone(140,.25,'sawtooth'); removeItem(it,false); ring(a.x,a.y-60*it.s,'#D93B30');
  }
}
function ring(x,y,c){ const r=document.createElementNS('http://www.w3.org/2000/svg','circle'); r.setAttribute('cx',x); r.setAttribute('cy',y); r.setAttribute('fill','none'); r.setAttribute('stroke',c); r.setAttribute('stroke-width','8'); $('fx').appendChild(r);
  const t0=performance.now(); (function a(n){ const p=(n-t0)/450; r.setAttribute('r',30+p*90); r.setAttribute('opacity',1-p); if(p<1) requestAnimationFrame(a); else r.remove(); })(t0); }
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; S.t+=dt;
  S.next-=dt; if(S.next<=0){ spawn(); const ph=S.t/60; S.next=Math.max(.75,2.1-ph*1.4)*(.7+Math.random()*.6); if(ph>.6&&Math.random()<.3) spawn(); }
  for(const it of [...S.items]) if(S.t-it.born>it.life){ if(it.risky){ S.missed++; S.missedTypes[it.type]=(S.missedTypes[it.type]||0)+1; if(S.streak>2) tone(220,.12,'triangle'); S.streak=0; } removeItem(it); }
  const left=Math.max(0,60-S.t); $('time').textContent=Math.ceil(left); $('time').className=left<=10?'low':'';
  $('score').textContent=S.score; $('combo').textContent='×'+Math.min(3,1+S.streak*.2).toFixed(1).replace('.0','');
  if(left<=0) return end();
  raf=requestAnimationFrame(loop);
}
function end(){
  S.over=true; cancelAnimationFrame(raf);
  for(const it of S.items) if(it.risky){ S.missed++; S.missedTypes[it.type]=(S.missedTypes[it.type]||0)+1; }
  const avg = S.rts.length ? (S.rts.reduce((a,b)=>a+b,0)/S.rts.length) : 0;
  const top = Object.entries(S.missedTypes).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const acc = S.found+S.wrong ? Math.round(S.found/(S.found+S.wrong)*100) : 0;
  $('endBox').innerHTML = `<h2 class="d">${S.found>=S.missed*2?'Scherp oog!':'Er glipte iets door.'}</h2><div class="bigs">${S.score}</div>
   <div class="stats"><div><b>${S.found}</b>risico's gespot</div><div><b>${S.missed}</b>gemist</div><div><b>${S.wrong}</b>onterecht</div><div><b>${avg?avg.toFixed(1)+'s':'–'}</b>gem. reactietijd</div></div>
   ${top.length?`<p style="font-size:17px;margin:6px 0">Vaakst gemist:</p><div class="miss">${top.map(([k,v])=>`<span>${TYPES[k].n} ×${v}</span>`).join('')}</div>`:''}
   <div id="rsSlot"></div><button class="go" id="again">NOG EEN KEER</button>`;
  $('end').hidden=false; $('again').onclick=start;
  RESULTS.mount($('rsSlot'), {score:S.score, lines:[`${S.found} risico's gespot`, `${S.missed} gemist`, `${S.wrong} keer een veilige situatie aangetikt (accuracy ${acc}%)`, `Gemiddelde reactietijd ${avg.toFixed(1)} s`, ...top.map(([k,v])=>`Vaakst gemist: ${TYPES[k].n} (${v}×)`)],
    outro:'In 60 seconden train je je blik op wat er mis kan gaan. Zo maakt Enversed Studios risico\'s herkenbaar en leerbaar in interactieve trainingen en serious games.'});
}
$('startBtn').onclick=start;
$('world').innerHTML=bg;
</script>
</body>
</html>
