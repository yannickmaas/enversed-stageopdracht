<!doctype html>
<html lang="nl" data-game="people-manager">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>People Manager — Enversed Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3A2A1A;--rs-acc:#FF6B5B;--rs-on:#fff;
  font-family:"Baloo 2","Trebuchet MS",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#2A3447;background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2px);background-size:22px 22px;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:20px;padding:10px 24px;color:#fff}
h1{margin:0;font-size:38px;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.2);line-height:1}
#zone{font-size:20px;opacity:.9}
.tag{font-size:17px;font-weight:700;color:#FFC93C;margin-top:4px;line-height:1}
.hud{margin-left:auto;display:flex;gap:12px}
.hud div{background:rgba(58,42,26,.55);border-radius:16px;padding:6px 16px;text-align:center;line-height:1.05;min-width:100px}
.hud b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.hud span{font-size:13px;opacity:.8}
main{flex:1;display:grid;grid-template-columns:1fr 230px;gap:16px;padding:0 24px 20px;min-height:0}
#boardWrap{position:relative;min-height:0;display:grid;place-items:center}
canvas{max-width:100%;max-height:100%;border-radius:22px;box-shadow:0 14px 0 rgba(10,15,25,.45),0 30px 60px rgba(0,0,0,.25);touch-action:none;cursor:pointer}
aside{display:flex;flex-direction:column;gap:12px;min-height:0}
.tray{display:flex;flex-direction:column;gap:12px}
.tool{font:inherit;border:0;border-radius:20px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;text-align:left;position:relative;transition:transform .1s;background:#FFF6E6;color:var(--ink);box-shadow:0 7px 0 #C9A878}
.tool .ic{width:62px;height:54px;display:grid;place-items:center;font-size:32px;flex:none}
.tool .ic svg{width:100%;height:100%;overflow:visible}
.tool small{display:block;font-weight:500;font-size:14px;opacity:.7;line-height:1.1}
.tool .cnt{position:absolute;top:-8px;right:-8px;background:#fff;color:var(--ink);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tool.sel{transform:translateY(4px);box-shadow:0 3px 0 #C9A878;outline:5px solid #FF6B5B}
.tool:disabled{opacity:.4;cursor:not-allowed}
.t-erase,.t-res{background:#6B5A48;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.25)}
.t-res{background:#FF6B5B;margin-top:auto}
#cases{background:rgba(255,255,255,.85);border-radius:20px;padding:12px 14px;flex:1;overflow:auto;min-height:0}
#cases h2{margin:0 0 6px;font-size:20px}
.goal{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:16px;line-height:1.2;border-bottom:1px solid rgba(58,42,26,.1)}
.goal i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:#FF6B5B;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.goal.ok i{background:none;font-size:22px}.goal.ok{opacity:.75}
.goal>div{flex:1}.goal small{display:block;opacity:.6;font-size:13px}
.pb{height:8px;border-radius:4px;background:rgba(58,42,26,.12);overflow:hidden;margin-top:5px}.pb em{display:block;height:100%;border-radius:4px;transition:width .3s}
.found{margin-top:10px;font-size:14px;opacity:.75}
.cs{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:16px;line-height:1.15;opacity:.45}
.cs.on{opacity:1}.cs i{font-style:normal;font-size:26px}
.cs small{display:block;opacity:.75;font-size:13px}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:#fff;color:var(--ink);font-weight:800;font-size:22px;border-radius:18px;padding:10px 22px;box-shadow:0 6px 0 rgba(0,0,0,.2);animation:tt 2.6s forwards;display:flex;gap:12px;align-items:center}
.t i{font-style:normal;font-size:34px}.t small{display:block;font-weight:500;font-size:15px}
.cp{position:fixed;left:calc(50% - 115px);top:110px;transform:translateX(-50%);z-index:9;width:min(560px,90vw);background:#fff;border-radius:22px;padding:18px 22px 16px;box-shadow:0 10px 0 rgba(0,0,0,.18),0 30px 60px rgba(0,0,0,.25);border-top:8px solid #FF6B5B;animation:cpIn .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;transition:opacity .5s,transform .5s}
.cp.out{opacity:0;transform:translateX(-50%) translateY(-12px)}
@keyframes cpIn{from{opacity:0;transform:translateX(-50%) scale(.85)}}
.cp-k{font-size:14px;font-weight:700;color:#FF6B5B;text-transform:uppercase;letter-spacing:.04em}
.cp-h{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:800;line-height:1.1;margin:4px 0 8px}.cp-h span{font-size:42px}
.cp p{margin:0 0 6px;font-size:19px;line-height:1.35}.cp .cp-w{color:#6B5A48;font-size:17px;margin:0}
@keyframes tt{0%{opacity:0;transform:translateY(-10px) scale(.9)}10%,82%{opacity:1;transform:none}100%{opacity:0}}
button:focus-visible,a:focus-visible{outline:5px solid #fff;outline-offset:3px}
.overlay{position:fixed;inset:0;background:rgba(58,42,26,.9);display:grid;place-items:center;z-index:10;padding:24px;color:#fff}
.overlay[hidden]{display:none}
.box{max-width:900px;width:100%;max-height:92vh;overflow:auto}
.box h2{font-size:clamp(44px,7vw,90px);margin:0;line-height:.95;font-weight:800}
.box p{font-size:20px;line-height:1.45;max-width:58ch}
.go{font:inherit;font-weight:800;font-size:26px;background:#FFC93C;color:var(--ink);border:0;border-radius:22px;padding:12px 36px;cursor:pointer;margin-top:10px;box-shadow:0 7px 0 #C99418}
.big{font-size:90px;font-weight:800;line-height:1}
.fin{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.fin div{background:rgba(255,255,255,.12);border-radius:18px;padding:12px;font-size:15px}.fin b{display:block;font-size:34px}
@media (max-width:1000px){main{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap}.tray{flex-direction:row;flex-wrap:wrap}#cases{display:none}.fin{grid-template-columns:1fr 1fr}body{overflow:auto}}
/* Dark mode (default; index.html?light for the old look): the white paper blocks need a dark
   playing field to stand out, and no large white surfaces may be on screen (they would look like paper). */
body.dark{--ink:#E3E8EF}
body.dark .tool:not(.t-erase):not(.t-res){background:#2B3445;color:#E3E8EF;box-shadow:0 7px 0 #151B26}
body.dark .tool .cnt{background:#C9D1DB;color:#1B2230}
body.dark .tool.sel{box-shadow:0 3px 0 #151B26}
body.dark #cases{background:rgba(27,34,48,.92);color:#E3E8EF}
body.dark .goal{border-bottom-color:rgba(227,232,239,.12)}
body.dark .pb{background:rgba(227,232,239,.15)}
body.dark .t{background:#2B3445;color:#E3E8EF;box-shadow:0 6px 0 rgba(0,0,0,.35)}
body.dark .cp{background:#2B3445;color:#E3E8EF}
body.dark .cp .cp-w{color:#AEB7C3}
body.dark .t-res{background:#2B3445;color:#FF8A7D;box-shadow:inset 0 0 0 3px #FF6B5B,0 7px 0 #151B26}
#camStatus{display:flex;align-items:center;gap:8px;background:rgba(58,42,26,.55);border-radius:16px;padding:6px 14px;font-size:15px;font-weight:700;white-space:nowrap;line-height:1.1}
#camStatus i{flex:none;width:12px;height:12px;border-radius:50%;background:#9AA3AF;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
#camStatus[data-s=on] i{background:#23A99A}
#camStatus[data-s=seen] i{background:#FFC93C;box-shadow:0 0 0 3px rgba(255,201,60,.35)}
#camStatus[data-s=off]{opacity:.7}
#camStatus[data-s=cal] i{background:#FF6B5B;box-shadow:0 0 0 3px rgba(255,107,91,.35)}
#toast.cam-low,.cp.cam-low{top:auto;bottom:32px} /* moved away from the physical object on the screen */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div><h1>People Manager</h1><div class="tag">Bouw de route. Begeleid de mensen.</div></div><span id="zone"></span>
  <div id="camStatus" data-s="off" role="status" title="Koppeling met camera_bridge.py (ws://127.0.0.1:8765)"><i></i><span>Camera niet verbonden</span></div>
  <div class="hud"><div><b id="inside">0</b><span>onderweg</span></div><div><b id="out">0</b><span>op bestemming</span></div><div><b id="lost">0</b><span>verdwaald</span></div><div><b id="score">0</b><span>score</span></div></div></header>
<main>
  <div id="boardWrap"><canvas id="cv" width="792" height="1152" aria-label="Speelveld: leg blokken om de stroom mensen te leiden"></canvas></div>
  <aside><div class="tray" id="tray" hidden></div><div id="cases"><h2>Doel in deze hal</h2><div id="caseList"></div></div><button class="tool t-res" id="resBtn"><span class="ic">🏁</span><span>Mijn resultaat</span></button></aside>
</main>
<div id="toast"></div>
<div class="overlay" id="end" hidden><div class="box" id="endBox"></div></div>
<script>// ===== Results: saving, leaderboard and mailing (shared by all Enversed games) =====
const RESULTS = (() => {
  const GAME = document.documentElement.dataset.game || 'game';
  const TITLE = document.title.split(' — ')[0];
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const dbP = use('db'), userP = use('user'), dlP = use('downloads');
  const LKEY = 'enversed-results-' + GAME;
  const local = {
    get() { try { return JSON.parse(localStorage.getItem(LKEY) || '[]'); } catch (e) { return []; } },
    put(a) { try { localStorage.setItem(LKEY, JSON.stringify(a.slice(-300))); } catch (e) {} }
  };
  const refs = {};   // runId -> {ref|localId}
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);

  const css = document.createElement('style');
  css.textContent = `
  .rs{margin-top:18px;padding-top:16px;border-top:2px solid rgba(127,127,127,.25);text-align:left}
  .rs h3{margin:0 0 8px;font-size:20px}
  .rs .rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rs input[type=text],.rs input[type=email]{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:2px solid rgba(127,127,127,.4);background:rgba(255,255,255,.92);color:#1b1b2b;width:100%}
  .rs label.rs-ok{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0;line-height:1.35;opacity:.9}
  .rs .rs-send{display:inline-block;font:inherit;font-weight:800;font-size:17px;text-decoration:none;padding:11px 18px;border-radius:10px;background:var(--rs-acc,#2F5BEA);color:var(--rs-on,#fff);border:0;cursor:pointer}
  .rs .rs-send[aria-disabled=true]{opacity:.45;pointer-events:none}
  .rs .rs-status{font-size:14px;margin:8px 0 0;min-height:18px;opacity:.85}
  .rs ol{padding-left:22px;margin:6px 0;font-size:16px}
  .rs ol li.me{font-weight:800}
  .rs .rs-admin{font:inherit;font-size:13px;background:none;border:1px solid rgba(127,127,127,.5);border-radius:6px;padding:5px 10px;margin-top:10px;cursor:pointer;color:inherit}
  .rs-simple .rs-row{display:flex;gap:10px;flex-wrap:wrap}
  .rs-simple .rs-row input{flex:1;min-width:220px;font-size:20px;padding:14px 16px}
  .rs-simple .rs-send{font-size:20px;padding:14px 22px}
  .rs-rank{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.rs-rank b{font-size:34px}.rs-rank span{opacity:.8}
  .rs-top{display:flex;gap:14px;list-style:decimal inside;padding:0;margin:0 0 14px;font-size:15px;opacity:.8;flex-wrap:wrap}
  .rs-outro{margin:18px 0 0;font-size:15px;line-height:1.45;opacity:.75;max-width:60ch}
  @media (max-width:560px){.rs .rs-grid{grid-template-columns:1fr}}`;
  document.head.appendChild(css);

  async function saveScore(runId, r) {
    const doc = { game: GAME, naam: r.naam || 'Anoniem', score: r.score, samenvatting: r.lines.join(' | '), at: new Date().toISOString() };
    const db = await dbP;
    if (db) {
      try {
        if (refs[runId]?.ref) { await refs[runId].ref.set(doc); }
        else { refs[runId] = { ref: await db.collection('scores').add(doc) }; }
        return 'db';
      } catch (e) { console.warn('db opslaan mislukt', e); }
    }
    const a = local.get();
    if (refs[runId]?.localId) { const i = a.findIndex(x => x.id === refs[runId].localId); if (i >= 0) a[i] = { ...doc, id: refs[runId].localId }; }
    else { const id = Date.now() + '-' + Math.random().toString(36).slice(2, 7); refs[runId] = { localId: id }; a.push({ ...doc, id }); }
    local.put(a); return 'local';
  }
  async function saveContact(r, naam, email) {
    const doc = { game: GAME, naam: naam || '', email, score: r.score, samenvatting: r.lines.join(' | '), toestemming: true, at: new Date().toISOString() };
    const db = await dbP;
    if (db) { try { await db.doc('data/contacts').collection('entries').add(doc); return true; } catch (e) { console.warn('contact niet opgeslagen', e); } }
    try { const k = LKEY + '-contacts'; const a = JSON.parse(localStorage.getItem(k) || '[]'); a.push(doc); localStorage.setItem(k, JSON.stringify(a.slice(-300))); return true; } catch (e) { return false; }
  }
  async function all() {
    const db = await dbP;
    if (db) { try { const s = await db.collection('scores').orderBy('score', 'desc').limit(1000).get(); return s.docs.map(d => ({ ...d.data(), _id: d.id })); } catch (e) {} }
    return local.get().sort((a, b) => b.score - a.score).map(x => ({ ...x, _id: x.id }));
  }
  async function top(n = 5) {
    const db = await dbP;
    if (db) { try { const s = await db.collection('scores').orderBy('score', 'desc').limit(n).get(); return s.docs.map(d => ({ ...d.data(), _id: d.id })); } catch (e) {} }
    return local.get().sort((a, b) => b.score - a.score).slice(0, n).map(x => ({ ...x, _id: x.id }));
  }
  function mailHref(email, r, naam) {
    const subject = `Jouw resultaat: ${TITLE}`;
    const body = [`Hoi${naam ? ' ' + naam : ''},`, '', `Bedankt voor het spelen van ${TITLE}. Dit is jouw resultaat:`, '', `Score: ${r.score}`, ...r.lines.map(l => '- ' + l), '', ...(r.tip ? [r.tip, ''] : []), 'Groet,', 'Enversed Studios'].join('\n');
    return `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  async function renderRank(el, runId, score) {
    const rows = await all(); if (!rows.length) { el.innerHTML = ''; return; }
    const place = rows.filter(x => x.score > score).length + 1;
    el.innerHTML = `<div class="rs-rank"><b>#${place}</b><span>van ${rows.length} ${rows.length === 1 ? 'speler' : 'spelers'}</span></div><ol class="rs-top">${rows.slice(0, 5).map(x => `<li>${x.score}</li>`).join('')}</ol>`;
  }
  async function renderBoard(el, runId) {
    const rows = await top(5);
    const mine = refs[runId]?.ref?.id || refs[runId]?.localId;
    el.innerHTML = rows.length ? `<h3>Ranglijst</h3><ol>${rows.map(x => `<li class="${x._id === mine ? 'me' : ''}">${esc(x.naam || 'Anoniem')}: ${x.score}${x._id === mine ? ' (jij)' : ''}</li>`).join('')}</ol>` : '';
  }

  async function exportCsv(btn) {
    const db = await dbP, dl = await dlP;
    let rows = [];
    if (db) { try { rows = (await db.doc('data/contacts').collection('entries').orderBy('at', 'desc').get()).docs.map(d => d.data()); } catch (e) {} }
    else { try { rows = JSON.parse(localStorage.getItem(LKEY + '-contacts') || '[]'); } catch (e) {} }
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = ['datum;naam;email;score;samenvatting', ...rows.map(r => [r.at, r.naam, r.email, r.score, r.samenvatting].map(q).join(';'))].join('\n');
    if (dl) { try { await dl.save({ filename: `${GAME}-resultaten.csv`, data: csv }); return; } catch (e) { btn.textContent = 'Download geannuleerd'; return; } }
    btn.textContent = rows.length ? `${rows.length} inzendingen (download alleen in de gepubliceerde versie)` : 'Nog geen inzendingen';
  }

  // Mount the results block into `container`. result = {score, lines:[...], tip?}; runId groups saves of one play session.
  async function mount(container, result, runId = 'run-' + Date.now(), opts = {}) {
    if (opts.simple !== false) return mountSimple(container, result, runId);
    const box = document.createElement('div'); box.className = 'rs';
    box.innerHTML = `
      <h3>Resultaat ontvangen per e-mail</h3>
      <div class="rs-grid">
        <input type="text" class="rs-name" placeholder="Je naam (voor de ranglijst)" maxlength="40" aria-label="Naam">
        <input type="email" class="rs-mail" placeholder="E-mailadres (optioneel)" aria-label="E-mailadres">
      </div>
      <label class="rs-ok"><input type="checkbox" class="rs-consent"> Ik ga akkoord dat mijn e-mailadres met mijn resultaat wordt opgeslagen door Enversed Studios.</label>
      <a class="rs-send" href="#" target="_blank" rel="noopener" aria-disabled="true">Resultaat mailen</a>
      <button type="button" class="rs-send rs-save" style="margin-left:6px;background:transparent;color:inherit;border:2px solid rgba(127,127,127,.5)">Alleen naam opslaan</button>
      <div class="rs-status" role="status"></div>
      <div class="rs-board"></div>`;
    container.appendChild(box);
    const $n = box.querySelector('.rs-name'), $m = box.querySelector('.rs-mail'), $c = box.querySelector('.rs-consent'),
          $send = box.querySelector('a.rs-send'), $save = box.querySelector('.rs-save'), $st = box.querySelector('.rs-status'), $b = box.querySelector('.rs-board');
    const refresh = () => {
      const ok = validEmail($m.value.trim()) && $c.checked;
      $send.setAttribute('aria-disabled', ok ? 'false' : 'true');
      $send.href = ok ? mailHref($m.value.trim(), result, $n.value.trim()) : '#';
    };
    [$n, $m, $c].forEach(el => el.addEventListener('input', refresh)); $c.addEventListener('change', refresh);
    const where = w => w === 'db' ? 'Opgeslagen in de gedeelde resultaten.' : 'Opgeslagen op dit apparaat.';
    // Save the score straight away (anonymous until a name is given)
    $st.textContent = 'Resultaat opslaan…';
    const w = await saveScore(runId, { ...result, naam: '' });
    $st.textContent = where(w); renderBoard($b, runId);
    $save.onclick = async () => { const w = await saveScore(runId, { ...result, naam: $n.value.trim() }); $st.textContent = where(w); renderBoard($b, runId); };
    $send.addEventListener('click', async e => {
      if ($send.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
      const email = $m.value.trim(), naam = $n.value.trim();
      // navigation to the mail app proceeds; saving runs alongside it
      saveScore(runId, { ...result, naam }).then(() => renderBoard($b, runId));
      const ok = await saveContact(result, naam, email);
      $st.textContent = ok ? `Je mailprogramma opent met je resultaat voor ${email}. Klik daar op verzenden.` : 'Je mailprogramma opent met je resultaat. Je e-mailadres kon niet worden opgeslagen.';
    });
    const user = await userP;
    if (user && user.canEdit && await user.canEdit()) {
      const b = document.createElement('button'); b.className = 'rs-admin'; b.type = 'button'; b.textContent = 'Beheer: inzendingen exporteren (CSV)';
      b.onclick = () => exportCsv(b); box.appendChild(b);
    }
  }
  async function mountSimple(container, result, runId) {
    const box = document.createElement('div'); box.className = 'rs rs-simple';
    box.innerHTML = `
      <div class="rs-rankwrap"></div>
      <div class="rs-row">
        <input type="email" class="rs-mail" placeholder="jouw@email.nl" aria-label="E-mailadres" autocomplete="email" inputmode="email">
        <a class="rs-send" href="#" target="_blank" rel="noopener" aria-disabled="true">Stuur mijn resultaat</a>
      </div>
      <label class="rs-ok"><input type="checkbox" class="rs-consent"> Enversed Studios mag mijn e-mailadres bewaren (optioneel)</label>
      <div class="rs-status" role="status"></div>
      ${result.outro ? `<p class="rs-outro">${esc(result.outro)}</p>` : ''}`;
    container.appendChild(box);
    const $m = box.querySelector('.rs-mail'), $c = box.querySelector('.rs-consent'), $send = box.querySelector('.rs-send'), $st = box.querySelector('.rs-status');
    const refresh = () => { const ok = validEmail($m.value.trim()); $send.setAttribute('aria-disabled', ok ? 'false' : 'true'); $send.href = ok ? mailHref($m.value.trim(), result, '') : '#'; };
    $m.addEventListener('input', refresh);
    $m.addEventListener('keydown', e => { if (e.key === 'Enter' && $send.getAttribute('aria-disabled') === 'false') $send.click(); });
    await saveScore(runId, { ...result, naam: '' });
    renderRank(box.querySelector('.rs-rankwrap'), runId, result.score);
    $send.addEventListener('click', async e => {
      if ($send.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
      const email = $m.value.trim();

    s.onmessage=e=>{ if(ws===s) receive(e.data); };
    s.onerror=()=>{}; // 'close' always follows; reconnecting happens there
    s.onclose=()=>{ if(ws!==s) return; if(connected) console.info('[camera] verbinding verbroken'); ws=null; connected=false; setObjs([]); status('off'); schedule(); };
  }
  function schedule(){ if(retryT) return; retryT=setTimeout(()=>{ retryT=null; connect(); },retryMs); retryMs=Math.min(RETRY_MAX,retryMs*2); }

  function receive(data){
    let m; try{ m=JSON.parse(data); }catch(e){ return; }
    if(m&&typeof m==='object'&&m.type==='cal'){ lastMsg=performance.now(); onCalMsg(m); return; } // calibration reply
    if(!m||typeof m!=='object'||typeof m.detected!=='boolean') return;
    lastMsg=performance.now(); raw=m;
    if(typeof m.exposure==='string'&&expoAsked&&m.exposure!==expoShown&&performance.now()-expoAsked<3000){
      expoShown=m.exposure; expoAsked=0; if(typeof toast==='function') toast(`<i>📷</i>${m.exposure.replace(/[<>&]/g,'')}`); }
    else if(typeof m.exposure==='string'&&!expoShown) expoShown=m.exposure;
    let list=[];
    if(m.detected){
      const pt=v=>Array.isArray(v)&&v.length===2&&num(v[0])&&num(v[1])&&Math.abs(v[0]-.5)<1&&Math.abs(v[1]-.5)<1?[v[0],v[1]]:null;
      if(Array.isArray(m.objects)) list=m.objects.filter(o=>o&&inRange(o.nx,o.ny)).map((o,i)=>({id:String(o.id??i),color:String(o.color??''),nx:c01(o.nx),ny:c01(o.ny),angle:num(o.angle)?o.angle:null,area:num(o.area)?o.area:0,
        kind:CHIPS[o.kind]||o.kind==='block'?o.kind:'probe', rim:pt(o.rim), head:pt(o.head), held:o.held===true,
        corners:Array.isArray(o.corners)&&o.corners.length===4&&o.corners.every(c=>pt(c))?o.corners.map(pt):null}));
      else if(inRange(m.nx,m.ny)) list=[{id:'0',color:'',nx:c01(m.nx),ny:c01(m.ny),angle:null,area:0}];
    }
    if(calib&&!calib.auto) calSample(list.find(o=>o.kind==='block'||o.kind==='probe')||list[0]||null); // manual calibration with the white block
    setObjs(list);
  }
  function setObjs(list){
    objs=list.map(o=>{ const p=toCanvas(o.nx,o.ny); if(!p) return null; const q={...o,x:p[0],y:p[1]};
      if(CHIPS[o.kind]){ // size and heading via the same calibration as the position (covers perspective and mirroring)
        const c=mapRaw(o.nx,o.ny), rim=o.rim&&mapRaw(o.rim[0],o.rim[1]), hd=o.head&&mapRaw(o.head[0],o.head[1]);
        q.r=c&&rim?Math.min(160,Math.max(12,Math.hypot(rim[0]-c[0],rim[1]-c[1]))):34;
        q.a=c&&hd&&Math.hypot(hd[0]-c[0],hd[1]-c[1])>1?(Math.atan2(hd[1]-c[1],hd[0]-c[0])*180/Math.PI+360)%360:null; }
      if(o.kind==='block'){
        const cs=o.corners&&o.corners.map(c=>mapRaw(c[0],c[1]));
        if(!cs||cs.some(c=>!c)) return null;
        // rectangle from the (perspective) quadrilateral: average opposite edges
        const ux=(cs[1][0]-cs[0][0]+cs[2][0]-cs[3][0])/2, uy=(cs[1][1]-cs[0][1]+cs[2][1]-cs[3][1])/2;
        const vx=(cs[3][0]-cs[0][0]+cs[2][0]-cs[1][0])/2, vy=(cs[3][1]-cs[0][1]+cs[2][1]-cs[1][1])/2;
        const L=Math.hypot(ux,uy)||1, ar=Math.atan2(uy,ux);
        q.x=cs.reduce((a,c)=>a+c[0],0)/4; q.y=cs.reduce((a,c)=>a+c[1],0)/4;
        q.hw=L/2; q.hh=Math.abs(-vx*Math.sin(ar)+vy*Math.cos(ar))/2; q.ar=ar; }
      return q; }).filter(Boolean);
    if(objs.some(o=>o.kind==='probe')) lastSeen=performance.now();
    syncChips(performance.now());
    syncWalls(performance.now());
    // The bridge already holds objects through short detection gaps and sends them in every message,
    // so an object that is missing from a message is really gone (no timeout needed; a stalled bridge is
    // handled by STALE). Timeouts would make walls flicker when messages arrive slowly.
    const present=new Set(objs.map(o=>o.id));
    if(!calib){ for(const [id,c] of chips) if(!present.has(id)) c.seen=-Infinity;
                for(const [id,w] of walls) if(!present.has(id)) w.seen=-Infinity; }
    listeners.forEach(f=>{ try{ f(objs); }catch(e){ console.error(e); } });
  }

  // ---- Chips -> blocks in the simulation ----
  function syncChips(now){
    if(calib) return; // positions are not reliable during calibration
    for(const o of objs){ if(!CHIPS[o.kind]) continue;
      let c=chips.get(o.id);
      if(!c){ c={kind:o.kind,b:{id:++bid,t:CHIPS[o.kind].t,x:o.x,y:o.y,a:o.a??90,alt:0,cam:o.kind,R:o.r+CHIP_PAD,inA:90,acc:0}}; chips.set(o.id,c); touch(); }
      const b=c.b; let moved=false;
      if(Math.hypot(o.x-b.x,o.y-b.y)>CHIP_POS_DB){ b.x=o.x; b.y=o.y; moved=true; }
      if(o.a!=null&&angDiff(o.a,b.a)>CHIP_ANG_DB){ b.a=o.a; moved=true; }
      b.R=o.r+CHIP_PAD; c.r=o.r; c.seen=now; c.held=o.held;
      if(moved) touch(); // physical play counts as activity (no idle reset)
    }
  }
  function updateChips(now){
    for(const [id,c] of chips){
      const b=c.b, gone=now-c.seen>CHIP_GRACE;
      c.wet=Z.water.some(r=>inRect(b.x,b.y,r)); // the existing rule: in the construction zone only a plank works
      const on=!gone&&!c.wet&&!calib, i=blocks.indexOf(b);
      if(on&&i<0) blocks.push(b); else if(!on&&i>=0) blocks.splice(i,1); // blocks is replaced on a new zone: re-added here
      if(gone) chips.delete(id);
    }
  }
  function syncWalls(now){
    if(calib) return;
    for(const o of objs){ if(o.kind!=='block') continue;
      let w=walls.get(o.id); const fresh=!w;
      if(!w){ w={}; walls.set(o.id,w); }
      // dead bands: small detection noise must not shake the wall
      if(fresh||Math.hypot(o.x-w.x,o.y-w.y)>CHIP_POS_DB||Math.abs(o.hw-w.hw)>CHIP_POS_DB||Math.abs(o.hh-w.hh)>CHIP_POS_DB||angDiff(o.ar*180/Math.PI*2,w.ar*180/Math.PI*2)/2>CHIP_ANG_DB){
        Object.assign(w,{x:o.x,y:o.y,hw:o.hw,hh:o.hh,ar:o.ar,cs:Math.cos(o.ar),sn:Math.sin(o.ar)}); touch(); }
      w.seen=now; w.held=o.held;
    }
  }
  function updateWalls(now){ for(const [id,w] of walls) if(now-w.seen>CHIP_GRACE||calib) walls.delete(id); }
  // Called by the simulation for every person, every frame (after moving).
  // Bounce: a person who walks into a white block bounces off it (angle in = angle out) and makes a little
  // jump with gravity (see BOUNCE in the game rules). BOUNCE.on=false gives the old behaviour: walk along the edge.
  function bounceOff(pp){
    for(const w of walls.values()){
      const dx=pp.x-w.x, dy=pp.y-w.y;
      let lx=dx*w.cs+dy*w.sn, ly=-dx*w.sn+dy*w.cs;
      const ex=w.hw+WALL.pad, ey=w.hh+WALL.pad;
      if(!(Math.abs(lx)<ex&&Math.abs(ly)<ey)) continue;
      let nlx=0, nly=0; // outward normal of the side that was hit (wall axes)
      if(ex-Math.abs(lx)<ey-Math.abs(ly)){ nlx=Math.sign(lx||1); lx=nlx*(ex+1); } else { nly=Math.sign(ly||1); ly=nly*(ey+1); }
      pp.x=w.x+lx*w.cs-ly*w.sn; pp.y=w.y+lx*w.sn+ly*w.cs;           // back out of the block
      const nx=nlx*w.cs-nly*w.sn, ny=nlx*w.sn+nly*w.cs;              // the same normal in screen axes
      const a=rad(pp.a), dxh=Math.cos(a), dyh=Math.sin(a), dot=dxh*nx+dyh*ny;
      if(dot<0){ // moving into the block: mirror the direction in the side that was hit
        const rx=dxh-2*dot*nx, ry=dyh-2*dot*ny;
        pp.a=Math.atan2(ry,rx)*180/Math.PI+(Math.random()-.5)*BOUNCE.spread;
        if(!(pp.z>2)) pp.vz=BOUNCE.hop; // jump (squash & stretch follows vz/z)
        pp.v=Math.min((pp.v||100)*1.08,160); // stream gets a bit of weight/energy from the hit
        pp.bounceAt=performance.now(); pp.bx=pp.x; pp.by=pp.y;
        pp.squash=1; // peak squash on impact frame
      }
    }
  }
  function collide(pp){
    if(BOUNCE.on) return bounceOff(pp);
    if(pp.wall&&(!walls.has(pp.wall)||angDiff(pp.a,pp.slideA)>30)){ // wall removed, or a chip gave a new direction meanwhile
      if(walls.has(pp.wall)) pp.wantA=null; else pp.a=pp.wantA;
      pp.wall=null; pp.wantA=null; }
    for(const [id,w] of walls){
      const dx=pp.x-w.x, dy=pp.y-w.y;
      let lx=dx*w.cs+dy*w.sn, ly=-dx*w.sn+dy*w.cs;           // person in the wall's own axes
      const ex=w.hw+WALL.pad, ey=w.hh+WALL.pad;
      const inside=Math.abs(lx)<ex&&Math.abs(ly)<ey;
      if(!inside){
        if(pp.wall===id){ // walking along this wall: past the end of the edge -> continue in the old direction
          const along=pp.wallAxis==='x'?Math.abs(ly)>=ey:Math.abs(lx)>=ex;
          const want=rad(pp.wantA), wx=Math.cos(want)*w.cs+Math.sin(want)*w.sn, wy=-Math.cos(want)*w.sn+Math.sin(want)*w.cs;
          const away=pp.wallAxis==='x'?wx*Math.sign(lx)>.2:wy*Math.sign(ly)>.2; // the old direction no longer points into the wall
          const off=pp.wallAxis==='x'?Math.abs(lx)-ex:Math.abs(ly)-ey; // drifted away from the edge
          if(along||away||off>10){ pp.a=pp.wantA; pp.wall=null; pp.wantA=null; }
        }
        continue; // not touching
      }
      // inside (also when the wall itself just moved over the person): push out to the nearest edge
      if(pp.wall!==id){ pp.wantA=pp.wall?pp.wantA:pp.a; pp.wall=id; pp.slide=0; }
      const want=rad(pp.wantA), wx=Math.cos(want)*w.cs+Math.sin(want)*w.sn, wy=-Math.cos(want)*w.sn+Math.sin(want)*w.cs;
      let tx=0, ty=0;
      if(ex-Math.abs(lx)<ey-Math.abs(ly)){ // closest to a short/long side along x: push out in x, walk along y
        lx=Math.sign(lx||1)*ex; pp.wallAxis='x';
        ty=Math.abs(wy)>.25?Math.sign(wy):(pp.slide||(pp.slide=ly>=0?1:-1)); }
      else { ly=Math.sign(ly||1)*ey; pp.wallAxis='y';
        tx=Math.abs(wx)>.25?Math.sign(wx):(pp.slide||(pp.slide=lx>=0?1:-1)); }  // head-on: go around the nearest end
      pp.x=w.x+lx*w.cs-ly*w.sn; pp.y=w.y+lx*w.sn+ly*w.cs;
      pp.a=pp.slideA=Math.atan2(tx*w.sn+ty*w.cs,tx*w.cs-ty*w.sn)*180/Math.PI;  // walk along the edge
    }
  }
  function drawWalls(c){ /* geen borders: witte blokken zijn onzichtbaar, alleen bounce */ }
  // Split branch for a chip, called by the simulation when a person reaches it.
  function splitTurn(b,pp){
    const cfg=CHIPS.split, d=((pp.a-b.inA)%360+540)%360-180; b.inA+=d*.2; // smoothed incoming direction, for the visual
    b.acc+=cfg.ratio; if(b.acc>=1){ b.acc-=1; return cfg.turns[0]; } return cfg.turns[1];
  }
  // Visuals: blue/navy only. Red, yellow, green and white are detection colors and could be seen as a chip.
  function chevrons(c,x,y,ang,from,len,t,alpha){
    const a=ang*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a), gap=26, off=(t/22)%gap;
    for(let s=from+off; s<from+len; s+=gap){ const px=x+ca*s, py=y+sa*s, f=Math.min(1,(s-from)/18,(from+len-s)/30);
      c.save(); c.globalAlpha=alpha*f; c.translate(px,py); c.rotate(a); c.lineCap='round'; c.lineJoin='round';
      c.beginPath(); c.moveTo(-6,-8); c.lineTo(3,0); c.lineTo(-6,8);
      c.lineWidth=8; c.strokeStyle=VIS.shade; c.stroke(); c.lineWidth=4; c.strokeStyle=VIS.line; c.stroke(); c.restore(); }
  }
  function drawChips(c,t){
    for(const ch of chips.values()){ const b=ch.b, r=ch.r+10, live=!ch.held&&!ch.wet;
      c.save();
      c.lineWidth=6; c.strokeStyle=VIS.shade; c.beginPath(); c.arc(b.x,b.y,r,0,7); c.stroke();
      c.lineWidth=2.5; c.strokeStyle=live?VIS.line:VIS.held; if(!live) c.setLineDash([7,7]); c.beginPath(); c.arc(b.x,b.y,r,0,7); c.stroke(); c.setLineDash([]);
      if(ch.wet){ const y=b.y+r+34<H?b.y+r+28:b.y-r-28; pill(c,'In de afgezette zone werkt alleen een plank',Math.min(W-220,Math.max(220,b.x)),y); }
      else if(ch.kind==='redirect') chevrons(c,b.x,b.y,b.a,r+4,120,t,.9);
      else { const inA=b.inA, cfg=CHIPS.split;
        { const a=(inA+180)*Math.PI/180; chevrons(c,b.x+Math.cos(a)*(r+70),b.y+Math.sin(a)*(r+70),inA,0,60,t,.3); } // where people come from (fainter, pointing at the chip)
        cfg.turns.forEach((tr,i)=>{ const share=i?1-cfg.ratio:cfg.ratio; if(share>0) chevrons(c,b.x,b.y,inA+tr,r+4,110,t,.35+.55*Math.min(1,share*2)); }); }
      c.restore(); }
  }

  // Thin ring just outside the physical object. No white: the bridge detects white, so a white ring
  // next to the object would merge with it. Teal = live detection, grey dashed = detection lost (fading out).
  function cursor(c,x,y,a,live){
    c.save(); c.globalAlpha=a;
    c.lineWidth=6; c.strokeStyle='rgba(34,52,79,.45)'; c.beginPath(); c.arc(x,y,ringR,0,7); c.stroke();
    c.lineWidth=2.5; c.strokeStyle=live?'#23A99A':'#9AA3AF'; if(!live) c.setLineDash([8,8]); c.beginPath(); c.arc(x,y,ringR,0,7); c.stroke();
    c.restore();
  }
  function pill(c,txt,x,y){
    c.font='700 18px "Baloo 2",sans-serif'; c.textAlign='center'; c.textBaseline='middle';
    const w=c.measureText(txt).width+32; c.fillStyle='rgba(34,52,79,.88)'; c.beginPath(); c.roundRect(x-w/2,y-20,w,40,20); c.fill(); c.fillStyle='#fff'; c.fillText(txt,x,y+1);
  }
  function drawCal(c,now){
    const tg=targets(), i=calib.pts.length;
    c.save();
    tg.forEach(([x,y],k)=>{
      if(k<i){ c.fillStyle='#23A99A'; c.beginPath(); c.arc(x,y,14,0,7); c.fill(); c.fillStyle='#fff'; c.font='800 16px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('✓',x,y+1); return; }
      const on=k===i;
      c.globalAlpha=on?1:.45; c.lineWidth=on?3:2;
      c.strokeStyle='rgba(34,52,79,.5)'; c.lineWidth+=3; c.beginPath(); c.arc(x,y,ringR,0,7); c.stroke(); c.lineWidth-=3;
      c.strokeStyle='#FF6B5B'; c.setLineDash([10,8]); c.beginPath(); c.arc(x,y,ringR,0,7); c.stroke(); c.setLineDash([]);
      c.beginPath(); c.moveTo(x-18,y); c.lineTo(x+18,y); c.moveTo(x,y-18); c.lineTo(x,y+18); c.stroke();
      c.fillStyle='#FF6B5B'; c.font='800 22px "Baloo 2",sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(k+1,x+ringR*.72,y-ringR*.72);
      if(on&&calib.buf.length){ const p=Math.min(1,(now-calib.buf[0][2])/CAL_HOLD); c.strokeStyle='#23A99A'; c.lineWidth=6; c.beginPath(); c.arc(x,y,ringR,-Math.PI/2,-Math.PI/2+p*Math.PI*2); c.stroke(); }
      c.globalAlpha=1;
    });
    const step=`Kalibratie ${i+1}/4: `;
    pill(c,(!connected?'Kalibratie: wacht op camera_bridge.py…':calib.near?step+'verplaats het doosje naar doel '+(i+1):calib.buf.length?step+'stil houden…':step+'leg het doosje op doel '+(i+1))+'  ·  Esc = stoppen',W/2,H/2);
    c.restore();
  }
  function hover(c,b,a){ // phase 2 preparation: show which game block is under the cursor (visual only)
    c.save(); c.globalAlpha=a*.9; c.lineWidth=4; c.strokeStyle='#FFC93C'; c.setLineDash([10,8]); c.translate(b.x,b.y);
    if(b.t==='bridge'){ c.rotate(b.a*Math.PI/180); c.beginPath(); c.roundRect(-PLANK_L/2-8,-PLANK_W/2-8,PLANK_L+16,PLANK_W+16,10); }
    else { c.beginPath(); c.arc(0,0,40,0,7); }
    c.stroke(); c.restore();
  }

  function debugInfo(c){ // raw input: helps verify mirroring/scaling
    const p=objs[0], txt=!connected?'camdebug: niet verbonden':!raw?'camdebug: nog geen bericht':
      `camdebug: detected=${raw.detected} nx=${num(raw.nx)?raw.nx.toFixed(3):raw.nx} ny=${num(raw.ny)?raw.ny.toFixed(3):raw.ny}`+(p?` → canvas ${Math.round(p.x)}, ${Math.round(p.y)} van ${W}×${H}`:'')+` · kalibratie ${cal?'aan':'uit'}`+[...chips.values()].map(ch=>` · ${ch.kind==='split'?'splits':'stroom '+Math.round(ch.b.a)+'°'} r=${Math.round(ch.r)}${ch.held?' (vast)':''}`).join('');
    c.save(); c.font='700 16px "Baloo 2",sans-serif'; c.textAlign='left'; c.textBaseline='middle';
    const w=c.measureText(txt).width+24; c.fillStyle='rgba(34,52,79,.85)'; c.beginPath(); c.roundRect(52,10,w,34,10); c.fill(); c.fillStyle='#fff'; c.fillText(txt,64,28);
    if(p){ c.fillStyle='#23A99A'; c.beginPath(); c.arc(p.x,p.y,5,0,7); c.fill(); } // unsmoothed position
    c.restore();
  }
  function draw(c,t){
    try{
      const dt=Math.min(.1,Math.max(0,(t-(lastDraw||t))/1000)), now=performance.now(); lastDraw=t;
      if(now-lastMsg>STALE){ if(connected&&objs.length) setObjs([]); if(calib&&!calib.auto) calSample(null); } // bridge stalled: show nothing
      updateChips(now); updateWalls(now);
      status(calib?'cal':!connected?'off':objs.length?'seen':'on');
      ringR=RING_PX*W/Math.max(1,cv.getBoundingClientRect().width); // screen px -> canvas units (CSS scaling)
      if(debug) debugInfo(c);
      if(calib){ if(calib.auto){ acalTick(now); if(calib) drawAutoCal(c); } else drawCal(c,now); return; }
      drawWalls(c); drawChips(c,t);
      const p=objs.find(o=>o.kind==='probe'); // the white test object drives the cursor; chips act on the simulation
      if(p){
        if(!cur||Math.hypot(p.x-cur.x,p.y-cur.y)>ringR*2) cur={x:p.x,y:p.y,a:cur?cur.a:0}; // big jump: no gliding across the board
        else { const k=1-Math.exp(-dt*18); cur.x+=(p.x-cur.x)*k; cur.y+=(p.y-cur.y)*k; }
        cur.a=Math.min(1,cur.a+dt*8); cur.live=true;
      }
      else if(cur&&now-lastSeen>LOST_GRACE){ cur.live=false; cur.a-=dt*1000/FADE_MS; if(cur.a<=0) cur=null; }
      if(!cur) return;
      const b=blockAt(cur.x,cur.y); if(b) hover(c,b,cur.a);
      cursor(c,cur.x,cur.y,cur.a,cur.live);
    }catch(e){ if(!failed){ failed=true; console.error('[camera] overlay-fout, game loopt door:',e); } }
  }
  // Does the object (cursor ring) cover this area? Used to keep game texts out from under the object.
  const hitBox=(cx,cy,rr,x,y,w,h)=>cx+rr>x&&cx-rr<x+w&&cy+rr>y&&cy-rr<y+h;
  const overlaps=(x,y,w,h)=>(!!cur&&cur.a>.1&&hitBox(cur.x,cur.y,ringR,x,y,w,h))||[...chips.values()].some(ch=>hitBox(ch.b.x,ch.b.y,ch.r+16,x,y,w,h))
    ||[...walls.values()].some(wl=>hitBox(wl.x,wl.y,Math.hypot(wl.hw,wl.hh)+12,x,y,w,h));
  function coversScreen(r){ if((!cur||cur.a<=.1)&&!chips.size&&!walls.size) return false; const b=cv.getBoundingClientRect(), sx=b.width/W, sy=b.height/H;
    return overlaps((r.left-b.left)/sx,(r.top-b.top)/sy,r.width/sx,r.height/sy); }

  cal=loadCal(); // after all helpers above are defined
  connect();
  if(/[?&]camcal\b/.test(location.search)) startCal(); // index.html?camcal starts calibration right away
  return {
    _calMath:{fitCal,makeCal,applyCal,acalTarget,ACAL_GRID}, // for tests
    draw, toCanvas, overlaps, coversScreen, splitTurn, collide, physicalCount:()=>chips.size+walls.size, setDebug:v=>{ debug=!!v; },
    calibrate:startCal, resetCalibration:()=>{ cal=null; saveCal(); },
    state:()=>({connected, calibrated:!!cal, calibrating:!!calib, objects:objs.map(o=>({...o})), cursor:cur?{x:cur.x,y:cur.y,live:!!cur.live,a:cur.a}:null, ringR,
      chips:[...chips.entries()].map(([id,ch])=>({id,kind:ch.kind,x:ch.b.x,y:ch.b.y,angle:ch.b.a,r:ch.r,held:!!ch.held,active:blocks.includes(ch.b)})),
      walls:[...walls.entries()].map(([id,w])=>({id,x:w.x,y:w.y,length:2*w.hw,width:2*w.hh,angle:(w.ar*180/Math.PI+360)%180,held:!!w.held}))}),
    onUpdate:f=>{ listeners.add(f); return ()=>listeners.delete(f); }
  };
})();
// Hooks for phase 2 (read-only; existing __pm functions remain unchanged).
Object.assign(window.__pm,{cam:CAM, blockAt:(x,y)=>blockAt(x,y), blocks:()=>blocks});
</script>
