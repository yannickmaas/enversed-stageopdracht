<!doctype html>
<html lang="nl" data-game="people-manager">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>People Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3A2A1A;--rs-acc:#FF6B5B;--rs-on:#fff;
  font-family:"Baloo 2","Trebuchet MS",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#2A3447;background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2px);background-size:22px 22px;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:20px;padding:10px 24px;color:#fff}
h1{margin:0;font-size:38px;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.2);line-height:1}
#zone{font-size:20px;opacity:.9}
.tag{font-size:17px;font-weight:700;color:#FFC93C;margin-top:4px;line-height:1}
.hud{margin-left:auto;display:flex;gap:12px}
.hud div{background:rgba(58,42,26,.55);border-radius:16px;padding:6px 16px;text-align:center;line-height:1.05;min-width:100px}
.hud b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.hud span{font-size:13px;opacity:.8}
main{flex:1;display:grid;grid-template-columns:1fr 170px;gap:10px;padding:0 12px 12px;min-height:0}
#boardWrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center} /* flex (not grid): lets the canvas' max-height:100% apply, so the whole board fits */
canvas{max-width:100%;max-height:100%;border-radius:22px;box-shadow:0 14px 0 rgba(10,15,25,.45),0 30px 60px rgba(0,0,0,.25);touch-action:none;cursor:pointer}
aside{display:flex;flex-direction:column;gap:8px;min-height:0}
.tray{display:flex;flex-direction:column;gap:12px}
.tool{font:inherit;border:0;border-radius:20px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;text-align:left;position:relative;transition:transform .1s;background:#FFF6E6;color:var(--ink);box-shadow:0 7px 0 #C9A878}
.tool .ic{width:62px;height:54px;display:grid;place-items:center;font-size:32px;flex:none}
.tool .ic svg{width:100%;height:100%;overflow:visible}
.tool small{display:block;font-weight:500;font-size:14px;opacity:.7;line-height:1.1}
.tool .cnt{position:absolute;top:-8px;right:-8px;background:#fff;color:var(--ink);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tool.sel{transform:translateY(4px);box-shadow:0 3px 0 #C9A878;outline:5px solid #FF6B5B}
.tool:disabled{opacity:.4;cursor:not-allowed}
.t-erase,.t-res{background:#6B5A48;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.25)}
.t-res{background:#FF6B5B;margin-top:auto;font-size:15px;padding:6px 10px;gap:6px;border-radius:14px}.t-res .ic{width:28px;height:28px;font-size:20px}
#cases{background:rgba(255,255,255,.85);border-radius:14px;padding:6px 10px;flex:1;overflow:auto;min-height:0}
#cases h2{margin:0 0 2px;font-size:14px}
.goal{display:flex;gap:6px;align-items:flex-start;padding:4px 0;font-size:12px;line-height:1.15;border-bottom:1px solid rgba(58,42,26,.1)}
.goal i{font-style:normal;flex:none;width:20px;height:20px;border-radius:50%;background:#FF6B5B;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.goal.ok i{background:none;font-size:15px}.goal.ok{opacity:.75}
.goal>div{flex:1}.goal small{display:block;opacity:.6;font-size:11px}
.pb{height:5px;border-radius:3px;background:rgba(58,42,26,.12);overflow:hidden;margin-top:3px}.pb em{display:block;height:100%;border-radius:4px;transition:width .3s}
.found{margin-top:4px;font-size:11px;opacity:.75}
.cs{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:16px;line-height:1.15;opacity:.45}
.cs.on{opacity:1}.cs i{font-style:normal;font-size:26px}
.cs small{display:block;opacity:.75;font-size:13px}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:#fff;color:var(--ink);font-weight:800;font-size:22px;border-radius:18px;padding:10px 22px;box-shadow:0 6px 0 rgba(0,0,0,.2);animation:tt 2.6s forwards;display:flex;gap:12px;align-items:center}
.t i{font-style:normal;font-size:34px}.t small{display:block;font-weight:500;font-size:15px}
@keyframes tt{0%{opacity:0;transform:translateY(-10px) scale(.9)}10%,82%{opacity:1;transform:none}100%{opacity:0}}
button:focus-visible,a:focus-visible{outline:5px solid #fff;outline-offset:3px}
.overlay{position:fixed;inset:0;background:rgba(58,42,26,.9);display:grid;place-items:center;z-index:10;padding:24px;color:#fff}
.overlay[hidden]{display:none}
.box{max-width:900px;width:100%;max-height:92vh;overflow:auto}
.box h2{font-size:clamp(44px,7vw,90px);margin:0;line-height:.95;font-weight:800}
.box p{font-size:20px;line-height:1.45;max-width:58ch}
.go{font:inherit;font-weight:800;font-size:26px;background:#FFC93C;color:#3A2A1A;border:0;border-radius:22px;padding:12px 36px;cursor:pointer;margin-top:10px;box-shadow:0 7px 0 #C99418}
.big{font-size:90px;font-weight:800;line-height:1}
.take{margin:6px 0 0}.take .go{font-size:20px;padding:9px 24px;background:#2B3445;color:#fff;box-shadow:0 6px 0 #151B26}
.qr{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}.qr img{width:220px;height:220px;background:#fff;padding:10px;border-radius:14px;image-rendering:pixelated}.qr p{max-width:320px;text-align:left;margin:0}
.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.fin div{background:rgba(255,255,255,.12);border-radius:18px;padding:12px;font-size:15px}.fin b{display:block;font-size:34px}
@media (max-width:1000px){header{flex-wrap:wrap}main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}aside{flex-direction:row;flex-wrap:wrap;align-items:flex-start}.tray{flex-direction:row;flex-wrap:wrap}#cases{flex:1 1 260px;max-height:16vh}.t-res{margin-top:0}.fin{grid-template-columns:1fr 1fr}body{overflow:auto}}
/* Dark mode (default; index.html?light for the old look): the white paper blocks need a dark
   playing field to stand out, and no large white surfaces may be on screen (they would look like paper). */
body.dark{--ink:#E3E8EF}
body.dark .tool:not(.t-erase):not(.t-res){background:#2B3445;color:#E3E8EF;box-shadow:0 7px 0 #151B26}
body.dark .tool .cnt{background:#C9D1DB;color:#1B2230}
body.dark .tool.sel{box-shadow:0 3px 0 #151B26}
body.dark #cases{background:rgba(27,34,48,.92);color:#E3E8EF}
body.dark .goal{border-bottom-color:rgba(227,232,239,.12)}
body.dark .pb{background:rgba(227,232,239,.15)}
body.dark .t{background:#2B3445;color:#E3E8EF;box-shadow:0 6px 0 rgba(0,0,0,.35)}
body.dark .t-res{background:#2B3445;color:#FF8A7D;box-shadow:inset 0 0 0 3px #FF6B5B,0 7px 0 #151B26}
#camStatus{display:flex;align-items:center;gap:8px;background:rgba(58,42,26,.55);border-radius:16px;padding:6px 14px;font-size:15px;font-weight:700;white-space:nowrap;line-height:1.1}
#camStatus i{flex:none;width:12px;height:12px;border-radius:50%;background:#9AA3AF;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
#camStatus[data-s=on] i{background:#23A99A}
#camStatus[data-s=seen] i{background:#FFC93C;box-shadow:0 0 0 3px rgba(255,201,60,.35)}
#camStatus[data-s=off]{opacity:.7}
#camStatus[data-s=cal] i{background:#FF6B5B;box-shadow:0 0 0 3px rgba(255,107,91,.35)}
body.dark .t-help{background:#2B3445;color:#E3E8EF;box-shadow:0 7px 0 #151B26}
.t-help{font-size:15px;padding:6px 10px;gap:6px;border-radius:14px;margin-top:auto}.t-help .ic{width:28px;height:28px;font-size:20px}
.t-help+.t-res{margin-top:0}
.steps{display:grid;gap:12px;margin:18px 0;padding:0;list-style:none;max-width:60ch}.steps li{display:flex;gap:14px;align-items:flex-start;font-size:19px;line-height:1.35}.steps li b{flex:none;width:36px;height:36px;border-radius:50%;background:#FFC93C;color:#3A2A1A;display:grid;place-items:center;font-size:18px}
#toast.cam-low{top:auto;bottom:32px} /* moved away from the physical object on the screen */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div><h1>People Manager</h1><div class="tag">Bouw de route. Begeleid de mensen.</div></div><span id="zone"></span>
  <div id="camStatus" data-s="off" role="status" title="Koppeling met camera_bridge.py (ws://127.0.0.1:8765)"><i></i><span>Camera niet verbonden</span></div>
  <div class="hud"><div><b id="score">0</b><span>score</span></div></div></header>
<main>
  <div id="boardWrap"><canvas id="cv" width="792" height="1152" aria-label="Speelveld: leg blokken om de stroom mensen te leiden"></canvas></div>
  <aside><div class="tray" id="tray" hidden></div><div id="cases"><h2>Doel in dit level</h2><div id="caseList"></div></div><button class="tool t-help" id="helpBtn"><span class="ic">❔</span><span>Hoe werkt het?</span></button><button class="tool t-res" id="resBtn"><span class="ic">🏁</span><span>Mijn resultaat</span></button></aside>
</main>
<div id="toast"></div>
<div class="overlay" id="end" hidden><div class="box" id="endBox"></div></div>
<!-- Phaser 3.90.0 from the CDN; without internet a copy of phaser.min.js next to this file is used -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" onerror="var s=document.createElement('script');s.src='phaser.min.js';document.head.appendChild(s);"></script>
<script>
const W=792, H=1152, T=72;
// Low-fidelity prototype: checkpoints are neutral numbered goals.
// Portrait field: entrance at the top, finish at the bottom. Every level has exactly three checkpoints.
// People arrive in waves and share the fill state of their wave: leeg (empty) -> halfvol -> vol.
// A wave takes a checkpoint as soon as CP_NEED of its people have passed it (not everyone has to); every
// checkpoint taken fills the whole wave up (1-2 checkpoints = halfvol, all 3 = vol).
// The field has borders (left, right, top: people cannot leave there); the bottom is open: whoever falls past the
// finish is 'verdwaald'. walls: fixed obstacles of the level, [x, y, width, height, rotation in degrees]
// (centre and size before rotating; a negative rotation of a wide wall slopes down to the left).
// Levels: route puzzles with walls as obstacles. The three checkpoints lie loose in the field, zigzagging left and right and always away
// from the line under the entrance, so without blocks nobody reaches one. Every checkpoint needs its own block:
// the player builds a route START -> block -> c1 -> block -> c2 -> block -> c3 -> finish.
// The walls stay off the intended routes and off the line under the entrance, and are checked not to create shortcuts.
// Checked in a simulation: without blocks no checkpoint is reached; random placements of 1 or 2 blocks never take
// all three; the intended route (3 blocks, angles in 15-degree steps as with the scroll wheel) completes the level
// in 65-80 s. Levels 1-3 still work with blocks 20 px off; level 4 needs precision.
// Intended routes ([type, x, y, degrees]):
//  1: lang 340,240,15 · lang 580,420,-15 · kort 260,880,-15
//  2: lang 452,240,-15 · lang 212,420,15 · kort 532,880,15   (mirror of level 1)
//  3: kort 260,240,0 · lang 700,600,0 · lang 380,760,15
//  4: kort 420,180,0 · lang 140,380,15 · kort 580,820,30
const ZONES=[
 {n:'Level 1',inv:{},spawn:[396,-10],
  water:[],cps:[['c1',546,340],['c2',156,720],['c3',78,960]],
  walls:[[619,256,180,18,25],[527,616,120,18,0]],
  end:{r:[22,1040,300,90],n:'Finish',ic:'🏁'}},
 {n:'Level 2',inv:{},spawn:[396,-10],
  water:[],cps:[['c1',246,340],['c2',636,720],['c3',714,960]],
  walls:[[174,255,180,18,-25],[212,499,120,18,0],[534,287,18,120,0]],
  end:{r:[470,1040,300,90],n:'Finish',ic:'🏁'}},
 {n:'Level 3',inv:{},spawn:[300,-10],
  water:[],cps:[['c1',465,360],['c2',465,700],['c3',676,960]],
  walls:[[571,299,140,18,25],[430,577,18,120,0],[615,716,120,18,0]],
  end:{r:[470,1040,300,90],n:'Finish',ic:'🏁'}},
 {n:'Level 4',inv:{},spawn:[396,-10],
  water:[],cps:[['c1',198,320],['c2',707,640],['c3',688,940]],
  walls:[[640,560,160,18,0],[100,240,180,18,-25],[582,597,120,18,0],[168,460,200,18,0]],
  end:{r:[440,1040,300,90],n:'Finish',ic:'🏁'}}
];
// Waves: size people per wave, one every `every` s. The next wave follows `pause` s after the last person of the
// wave has left the field (finish or verdwaald), or at the latest maxWait s after the last one entered.
const WAVE={size:1, every:.2, pause:2.5, maxWait:12, idleAfter:15}; // a wave is now a single person
// idleAfter: niet meer gebruikt; actief/inactief wordt bepaald door isActive() (ACTIVE_FOR seconden na de laatste blokactie)
const SPEED=2; // walking speed factor (2 = twice as fast as the original stream)
const CP_NEED=Math.min(3,WAVE.size); // people of one wave that must pass a checkpoint before the wave has taken it (1 with single-person waves)
// Fill states: 0 checkpoints taken = leeg, 1-2 = halfvol, all 3 = vol. Points per person at the finish, by state.
const FILL_NAMES=['leeg','halfvol','vol'], FILL_PTS=[1,5,20];
const fillState=n=>n>=3?2:n>=1?1:0;
const SOLID_PAD=6, BORDER=16; // SOLID_PAD: half the width of a person; BORDER: thickness of the field border
// A collision triggers one small hop in a wide sideways arc (like a fountain) that eases back into the downward stream.
// Applies to the white blocks, the level walls and the field border (border: bounce power there, a light bounce). hop: start speed upwards (px/s, 260 = small hop); curveAngle: launch direction (0 = straight sideways, 90 = down);
// airSpeed: ground speed while in the air (wider arc); curve: seconds to turn back to 90°.
// Water feel: a hit near the middle of a block sprays high and wide, a hit near its edge only bends around it
// (glance: extra launch angle towards 90° for edge hits); every person gets its own height/speed/curve (vary).
const BOUNCE={on:true, hop:340, gravity:800, curve:2.9, curveAngle:8, curveSpread:10, airSpeed:290, glance:55, vary:.1, border:.28}; // muisversie: iets meer bounce (was hop 260, curve 2.6, airSpeed 240, border .2); weinig willekeur (spread 10, vary .1) zodat een route voorspelbaar is
const HOP_LIFT=.75; // how far a jumping person is drawn above their floor position (z * HOP_LIFT); used by drawing and checkpoints
const GOAL=10, R_TRI=34, R_ROL=30, R_CUBE=30, R_CP=42, PLANK_L=160, PLANK_W=48;
const SHIRTS=['#E8453C','#2F7FD1','#23A99A','#F2A100','#7A5CFA','#E8457A','#3A9D4E'];
const SKIN=['#F2C9A0','#D9A27A','#A8704A','#7A4E2E','#F5D6B8'];
// lastTouch=-1e9: de game start als inactief (wave blijft 1, geen meldingen) tot iemand iets doet
let zoneArrived=0, zoneFull=0, zoneFill=[0,0,0], wave=null, solids=[], solidsVer=0, Z, zi, blocks, people, spawnT, tool=null, inv, cps, zoneT=0, totals, celebrate=0, lastTouch=-1e9, round=1, bid=0, bg=null, drag=null;
const cv=document.getElementById('cv'), $=id=>document.getElementById(id);
// Rendering is done by Phaser (scene `Hall` below). The drawing helpers (stand, endpoint, entrance, wood, person, ...)
// draw into `ctx`, which the scene points at the canvas of a Phaser texture while it builds that texture.
let ctx=null;
function ac(){ if(!ac.c){try{ac.c=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} return ac.c }
function tone(f,d=.08,t='triangle',v=.06){const c=ac(); if(!c||c.state!=='running')return; const o=c.createOscillator(),g=c.createGain(); o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}
// Keep messages out from under the physical object lying on the screen (camera cursor).
function camAvoid(el){ el.classList.remove('cam-low'); if(window.CAM&&CAM.coversScreen(el.getBoundingClientRect())) el.classList.add('cam-low'); }
function freeY(w,h){ if(window.CAM) for(const y of [H/2,H*.25,H*.75]) if(!CAM.overlaps(W/2-w/2,y-h/2,w,h)) return y; return H/2; }
const ACTIVE_FOR=20; // actief = binnen zoveel seconden na de laatste aanraking/sleepactie; alleen dan meldingen en scoretelling
// With blocks of the player on the field, a game is going on even if nobody touches anything (waiting for the
// persons to fill up): it then stays active for ACTIVE_WITH_BLOCKS s after the last block action.
const ACTIVE_WITH_BLOCKS=300;
const isActive=()=>{ const t=performance.now()-lastTouch; return t<=ACTIVE_FOR*1000||(t<=ACTIVE_WITH_BLOCKS*1000&&!!window.CAM&&CAM.physicalCount()>0); };
// While a game is going, its results keep it active: a person reaching the finish or taking a checkpoint counts as
// play. So a player who has set up the blocks can watch the persons run without touching anything, and the level
// still counts up to the end. Without results (no one gets through) it still goes inactive after ACTIVE_FOR s.
function keepActive(){ if(isActive()) lastTouch=performance.now(); }
let arrivalShown=false; // 'Er komt iemand aan' alleen één keer, bij de eerste persoon na het opstarten
// Messages per person (arrived, checkpoint taken) only for the first wave somebody plays in a level, so they do
// not repeat with every person. Level and finish messages are not affected.
let toastWave=null;
const waveToasts=Wv=>{ if(!toastWave&&isActive()) toastWave=Wv; return Wv===toastWave; };
// force=true: system messages (camera, calibration) always show, also when nobody is playing
function sysToast(html){ toast(html,true); }
function toast(html,force){ if(!force&&!isActive()) return; /* niemand aan het spelen: geen meldingen voor voorbijgangers */ const t=document.createElement('div'); t.className='t'; t.innerHTML=html; $('toast').appendChild(t); camAvoid($('toast')); setTimeout(()=>t.remove(),2700); while($('toast').children.length>3) $('toast').firstChild.remove(); }
// ---- Wooden toy blocks ----
const WOOD={arrow:['#E8453C','#B8322B','#F26B62'],split:['#2F7FD1','#225F9E','#5C9DE0'],cube:['#F2B705','#C08F00','#F8CD45'],bridge:['#D9A86C','#B5874F','#E8C390']};
function grain(c,x,y,w,h,col){ c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip(); c.strokeStyle=col; c.globalAlpha=.35; c.lineWidth=1.5; for(let i=0;i<5;i++){ c.beginPath(); c.moveTo(x,y+6+i*(h/5)); c.bezierCurveTo(x+w*.3,y+2+i*(h/5),x+w*.6,y+10+i*(h/5),x+w,y+5+i*(h/5)); c.stroke(); } c.restore(); }
function drawBlock(c,t,px,py,d,lift=0){
  const [top,side,hi]=WOOD[t], cx=px+T/2, cy=py+T/2, H=12;
  c.fillStyle=`rgba(58,42,26,${.28-lift/300})`; c.beginPath(); c.ellipse(cx+3,py+T/2+lift+H+4,T*.38+lift/6,T*.2,0,0,7); c.fill();
  if(t==='bridge'){ // plank over the water
    c.fillStyle=side; c.fillRect(px-4,py+14+H,T+8,T-28); c.fillStyle=top; c.fillRect(px-4,py+14,T+8,T-28); grain(c,px-4,py+14,T+8,T-28,'#8A6232');
    c.fillStyle=hi; c.fillRect(px-4,py+14,T+8,4); c.fillStyle='#8A6232'; [px+4,px+T-6].forEach(x=>{ c.beginPath(); c.arc(x,py+T/2,2.5,0,7); c.fill(); }); return; }
  if(t==='cube'){
    c.fillStyle=side; c.beginPath(); c.roundRect(px+10,py+12+H,T-20,T-24,6); c.fill();
    c.fillStyle=top; c.beginPath(); c.roundRect(px+10,py+12,T-20,T-24,6); c.fill(); grain(c,px+10,py+12,T-20,T-24,side); c.fillStyle=hi; c.fillRect(px+14,py+15,T-28,4);
    c.fillStyle='rgba(255,255,255,.8)'; c.font='800 22px "Baloo 2",sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('■',cx,py+T/2+1); return; }
  if(t==='split'){ // roller / cylinder
    c.fillStyle=side; c.beginPath(); c.ellipse(cx,cy+H,22,22,0,0,7); c.fill(); c.fillRect(cx-22,cy,44,H);
    c.fillStyle=top; c.beginPath(); c.ellipse(cx,cy,22,22,0,0,7); c.fill();
    c.strokeStyle='rgba(0,0,0,.18)'; c.lineWidth=2; [16,10,4].forEach(r=>{ c.beginPath(); c.arc(cx,cy,r,0,7); c.stroke(); });
    c.fillStyle=hi; c.beginPath(); c.arc(cx-8,cy-9,5,0,7); c.fill(); return; }
  // triangle: the tip points in the walking direction
  c.save(); c.translate(cx,cy); c.rotate(d*Math.PI/2);
  const tri=(oy)=>{ c.beginPath(); c.moveTo(22,oy); c.lineTo(-18,-22+oy); c.lineTo(-18,22+oy); c.closePath(); };
  c.restore();
  c.save(); c.translate(cx,cy+H); c.rotate(d*Math.PI/2); c.fillStyle=side; c.beginPath(); c.moveTo(22,0); c.lineTo(-18,-22); c.lineTo(-18,22); c.closePath(); c.fill(); c.restore();
  c.save(); c.translate(cx,cy); c.rotate(d*Math.PI/2); c.fillStyle=top; tri(0); c.fill(); c.save(); tri(0); c.clip(); grain(c,-18,-22,40,44,side); c.restore(); c.strokeStyle=hi; c.lineWidth=3; c.beginPath(); c.moveTo(-15,-17); c.lineTo(-15,17); c.stroke(); c.restore();
}
function blockSVG(t){
  const [top,side,hi]=WOOD[t];

// Every person is simulated on its own as a fluid particle; together they behave like one flowing mass.
//  - Gravity pulls people towards the bottom of the board. In free fall the sideways speed fades out, so someone
//    who drops off an edge curves smoothly down and joins the stream again.
//  - The white blocks are solid surfaces: people never pass through them. On a slope gravity makes them slide;
//    on a flat top they spread sideways towards the nearest way down (path navigation via a flow field over the
//    board, rebuilt in real time whenever a block is placed, moved or removed).
//  - Split: the stream divides over both edges of a block depending on where each person lands.
//  - Pooling: people keep personal space (separation = pressure) and match their neighbours' speed (viscosity).
//    Behind obstacles they pile up; with no way down they climb slowly along the flow field to a passage.
//  - Narrow gap: the walls squeeze the group into a compact stream; in open space it spreads out again.
//  - Heading turns gradually (max FLOW.turn deg/s): no sudden direction changes.
// Off by default: the bounce movement (BOUNCE) is used. index.html?flow switches this water flow on.
// g: gravity (px/s2); fall/spread/climb: speed factors on each person's own speed pp.v; air: sideways damping in

function flowPrepare(){
  const v=solidsVer+':'+(window.CAM&&CAM.wallsVer?CAM.wallsVer():0), now=performance.now(); // level walls + white blocks
  if(v!==FIELD.ver&&(now-FIELD.at>150||!FIELD.d||!FIELD.ver.startsWith(solidsVer+':'))){
    buildField([...solids,...(window.CAM&&CAM.wallList?CAM.wallList():[])]); FIELD.ver=v; FIELD.at=now; }
  CROWD.clear(); const s=FLOW.r*2;
  for(const pp of people){ if(pp.fall>0||pp.gone) continue; const k=crowdKey(Math.floor(pp.x/s),Math.floor(pp.y/s)); let a=CROWD.get(k); if(!a) CROWD.set(k,a=[]); a.push(pp); }
}
function woodBlocks(pp){ // the wooden blocks (unchanged rules; only placed via __pm.place now)
  for(const b of blocks){
    const d=Math.hypot(pp.x-b.x,pp.y-b.y);
    if(b.t==='arrow' && d<(b.R||R_TRI) && pp.hit[b.id]!==1){ steer(pp,b.a,b); pp.hit={}; pp.hit[b.id]=1; }
    if(b.t==='split' && d<(b.R||R_ROL) && pp.hit[b.id]!==1){ const turn=b.cam?CAM.splitTurn(b,pp):((b.alt^=1)?-90:90); steer(pp,pp.a+turn,b); pp.hit={}; pp.hit[b.id]=1; }
    if(b.t==='cube' && d<R_CUBE && pp.hit[b.id]!==1){ pp.a+=180; const n=Math.atan2(pp.y-b.y,pp.x-b.x); pp.x=b.x+Math.cos(n)*(R_CUBE+2); pp.y=b.y+Math.sin(n)*(R_CUBE+2); pp.hit={}; pp.hit[b.id]=1; }
  }
}
// Solid rectangle with rounded corners (radius SOLID_PAD = half a person). A person is pushed back to the surface
// and only keeps the speed along it, so on a slope they slide, on a top they rest and spread, and round a corner
// they flow smoothly over the edge. Tops (normal pointing up) are stored as pp.sup (support) for the next frame.
function rectCollide(pp,w,id){
  const dx=pp.x-w.x, dy=pp.y-w.y, lx=dx*w.cs+dy*w.sn, ly=-dx*w.sn+dy*w.cs, pad=SOLID_PAD;
  if(Math.abs(lx)>w.hw+pad+1||Math.abs(ly)>w.hh+pad+1) return;
  let qx=Math.max(-w.hw,Math.min(w.hw,lx)), qy=Math.max(-w.hh,Math.min(w.hh,ly)), nlx, nly;
  const ex=lx-qx, ey=ly-qy, d=Math.hypot(ex,ey);
  if(d>1e-6){ if(d>=pad+.5) return; nlx=ex/d; nly=ey/d; }
  else if(w.hw-Math.abs(lx)<w.hh-Math.abs(ly)){ nlx=Math.sign(lx||1); nly=0; qx=nlx*w.hw; } // inside (a block was put on them): out via the nearest side
  else { nlx=0; nly=Math.sign(ly||1); qy=nly*w.hh; }
  const px=qx+nlx*pad, py=qy+nly*pad, tx=w.x+px*w.cs-py*w.sn, ty=w.y+px*w.sn+py*w.cs;
  // a block that is moved onto people pushes them out over a few frames (max 5 px per frame): no teleporting
  const mx=tx-pp.x, my=ty-pp.y, m=Math.hypot(mx,my), k=m>5?5/m:1; pp.x+=mx*k; pp.y+=my*k;
  const nx=nlx*w.cs-nly*w.sn, ny=nlx*w.sn+nly*w.cs, vn=pp.vx*nx+pp.vy*ny;
  if(vn<0){ pp.vx-=vn*nx; pp.vy-=vn*ny; }
  if(ny<-.3&&(!pp.sup||ny<pp.sup.ny)) pp.sup={nx,ny,w:id,wx:w.x,wy:w.y};
}
// Bounce off one solid rectangle (level wall, field border or white block): one small hop and a curve back into
// the downward stream. Where along the hit side decides the power: the middle splashes, an edge only bends around.
function bounceRect(pp,w){
  const dx=pp.x-w.x, dy=pp.y-w.y;
  let lx=dx*w.cs+dy*w.sn, ly=-dx*w.sn+dy*w.cs;
  const ex=w.hw+SOLID_PAD, ey=w.hh+SOLID_PAD;
  if(!(Math.abs(lx)<ex&&Math.abs(ly)<ey)) return;
  let nlx=0, nly=0; // outward normal of the side that was hit (wall axes)
  if(ex-Math.abs(lx)<ey-Math.abs(ly)){ nlx=Math.sign(lx||1); lx=nlx*(ex+1); } else { nly=Math.sign(ly||1); ly=nly*(ey+1); }
  pp.x=w.x+lx*w.cs-ly*w.sn; pp.y=w.y+lx*w.sn+ly*w.cs;           // back out of the block
  const nx=nlx*w.cs-nly*w.sn, ny=nlx*w.sn+nly*w.cs;              // the same normal in screen axes
  const a=rad(pp.a), dot=Math.cos(a)*nx+Math.sin(a)*ny;
  if(dot<0){ // curve around the collision, then resume the natural downward stream
    const side=Math.abs(nx)>.2?Math.sign(nx):(pp.x>=w.x?1:-1); // fly off on the side that was hit
    // the field border is soft: people only bounce lightly off the edge of the field
    const along=nly?Math.abs(lx)/ex:Math.abs(ly)/ey, power=w.soft?BOUNCE.border:.3+.7*(1-Math.min(1,along));
    const rnd=()=>1+(Math.random()-.5)*2*BOUNCE.vary;
    const sa=BOUNCE.curveAngle+(1-power)*BOUNCE.glance+(Math.random()-.5)*BOUNCE.curveSpread;
    pp.bounceStartA=side>0?sa:180-sa;
    pp.bounceDur=BOUNCE.curve*(.55+.45*power)*rnd();
    pp.airV=BOUNCE.airSpeed*(.6+.4*power)*rnd();
    pp.a=pp.bounceStartA; pp.bounceCurve=pp.bounceDur;
    if(!(pp.z>2)) pp.vz=BOUNCE.hop*power*rnd(); // small hop (squash & stretch follows vz/z)
    pp.v=Math.min((pp.v||150*SPEED)*1.08,220*SPEED); // stream gets a bit of weight/energy from the hit
    pp.bounceAt=performance.now(); pp.bx=pp.x; pp.by=pp.y;
    pp.squash=1; // peak squash on impact frame
  }
}
function flowMove(pp,dt){
  if(pp.vx==null){ pp.vx=Math.cos(rad(pp.a))*pp.v*.8; pp.vy=Math.sin(rad(pp.a))*pp.v*.8; pp.side=Math.random()<.5?-1:1; }
  const sup=pp.sup; pp.sup=null; // surface contact found by the collision of the previous frame
  if(pp.push>0) pp.push-=dt; // a wooden block just steered this person: gravity waits briefly
  let gk=pp.push>0?.15:1;
  // ---- neighbours: personal space (pressure), resting on others, speed matching (viscosity) ----
  const s=FLOW.r*2, cx=Math.floor(pp.x/s), cy=Math.floor(pp.y/s); let mx=0, my=0, nn=0, onCrowd=false;
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){ const a=CROWD.get(crowdKey(cx+i,cy+j)); if(!a) continue;
    for(const q of a){ if(q===pp) continue; let dx=pp.x-q.x, dy=pp.y-q.y, d=Math.hypot(dx,dy);
      if(d>=FLOW.r*1.8) continue;
      if(q.vx!=null){ mx+=q.vx; my+=q.vy; nn++; }
      if(d>=FLOW.r) continue;
      if(d<.01){ dx=Math.random()-.5; dy=Math.random()-.5; d=Math.hypot(dx,dy); }
      const k=(FLOW.r-d)/d*FLOW.push*.5; pp.x+=dx*k; pp.y+=dy*k; // each of the pair moves half
      const ux=-dx/d, uy=-dy/d, vn=pp.vx*ux+pp.vy*uy; if(vn>0){ pp.vx-=ux*vn*.5; pp.vy-=uy*vn*.5; } // do not keep pushing into them
      if(uy>.5) onCrowd=true; } }
  if(nn){ const k=Math.min(1,FLOW.visc*dt); pp.vx+=(mx/nn-pp.vx)*k; pp.vy+=(my/nn-pp.vy)*k; }
  // ---- on a surface (white block, or resting on the pile): spread sideways towards a way down ----
  const resting=sup||(onCrowd&&pp.vy<pp.v*.35);
  if(resting){
    let nx=0, ny=-1; if(sup){ nx=sup.nx; ny=sup.ny;
      if(sup.w!==pp.supW){ pp.supW=sup.w; const o=(pp.x-sup.wx)*-ny+(pp.y-sup.wy)*nx; pp.side=Math.abs(o)>3?Math.sign(o):pp.side; } } // split: land left of the middle -> go left
    let tx=-ny, ty=nx; const fd=fieldDir(pp.x,pp.y,pp.side);
    const along=fd?fd[0]*tx+fd[1]*ty:0;
    if(sup&&Math.abs(nx)>.14){ if(ty<0){ tx=-tx; ty=-ty; } } // a slope: water only flows downhill, whatever the field says
    else if(Math.abs(along)>.2){ if(along<0){ tx=-tx; ty=-ty; } } else if(tx*pp.side<0){ tx=-tx; ty=-ty; }
    if(fd&&fd[1]<-.3&&!(sup&&Math.abs(nx)>.14)){ // in a pocket: the way out goes up, climb slowly along the field
      const k=Math.min(1,FLOW.grip*dt), c=pp.v*FLOW.climb; pp.vx+=(fd[0]*c-pp.vx)*k; pp.vy+=(fd[1]*c-pp.vy)*k; gk=.25; }
    else { const cur=pp.vx*tx+pp.vy*ty, want=pp.v*FLOW.spread*(sup?1:.6);
      if(cur<want){ const dv=(want-cur)*Math.min(1,FLOW.grip*dt); pp.vx+=tx*dv; pp.vy+=ty*dv; } } // a slope may make them faster: no braking
  } else pp.vx*=Math.exp(-FLOW.air*dt); // free fall: sideways speed fades, the path bends smoothly down
  // ---- gravity, speed limit, small natural wandering ----
  pp.vy+=FLOW.g*gk*dt; pp.vx+=(Math.random()-.5)*dt*24;
  const vmax=pp.v*FLOW.fall, sp0=Math.hypot(pp.vx,pp.vy); if(sp0>vmax){ pp.vx*=vmax/sp0; pp.vy*=vmax/sp0; }
  pp.x+=pp.vx*dt; pp.y+=pp.vy*dt;
  const a0=pp.a; woodBlocks(pp);
  if(pp.a!==a0){ const v=Math.max(pp.v,Math.hypot(pp.vx,pp.vy)); pp.vx=Math.cos(rad(pp.a))*v; pp.vy=Math.sin(rad(pp.a))*v; pp.push=.6; }
  for(const w of solids) rectCollide(pp,w,w.id); // field border and level walls
  if(window.CAM&&CAM.flowCollide) CAM.flowCollide(pp); // white blocks are solid: push out, keep only the speed along the surface
  // ---- heading follows the motion gradually; walking animation follows the real speed ----
  const sp=Math.hypot(pp.vx,pp.vy);
  if(sp>12){ const ta=Math.atan2(pp.vy,pp.vx)*180/Math.PI, d=((ta-pp.a)%360+540)%360-180, m=FLOW.turn*dt;
    pp.a+=Math.max(-m,Math.min(m,d*Math.min(1,8*dt))); }
  pp.ph+=dt*Math.max(sp,15)/9;
}
function update(dt){
  zoneT+=dt; waveTick(dt);
  if(FLOW.on) flowPrepare();
  for(const pp of people){
    if(pp.fall>0){ pp.fall+=dt; if(pp.fall>.8) pp.gone=true; continue; }
    if(celebrate>0){ pp.alpha-=dt*1.4; if(pp.alpha<=0){ pp.gone=true; continue; } }
    if(FLOW.on) flowMove(pp,dt); else { // bounce movement (default): walk down, hop and curve off every wall
    if(pp.bounceCurve>0){
      pp.bounceCurve=Math.max(0,pp.bounceCurve-dt);
      const t=1-pp.bounceCurve/(pp.bounceDur||BOUNCE.curve), progress=t*t; // ease-in: fly sideways first, then bend down
      pp.a=pp.bounceStartA+(90-pp.bounceStartA)*progress;
    } else pp.a+= (Math.random()-.5)*dt*6; // slight wandering keeps the stream natural
    // like water: the splash speed fades out gradually over the curve instead of stopping at the landing
    const fade=pp.bounceCurve>0?pp.bounceCurve/(pp.bounceDur||BOUNCE.curve):0;
    const a=rad(pp.a), sp=pp.v+Math.max(0,(pp.airV||BOUNCE.airSpeed)-pp.v)*fade;
    pp.x+=Math.cos(a)*sp*dt; pp.y+=Math.sin(a)*sp*dt; pp.ph+=dt*pp.v/9;
    for(const b of blocks){
      const d=Math.hypot(pp.x-b.x,pp.y-b.y);
      // b.R: trigger radius of a physical chip (its size on the screen); b.cam split: configurable branches
      if(b.t==='arrow' && d<(b.R||R_TRI) && pp.hit[b.id]!==1){ steer(pp,b.a,b); pp.hit={}; pp.hit[b.id]=1; }
      if(b.t==='split' && d<(b.R||R_ROL) && pp.hit[b.id]!==1){ const turn=b.cam?CAM.splitTurn(b,pp):((b.alt^=1)?-90:90); steer(pp,pp.a+turn,b); pp.hit={}; pp.hit[b.id]=1; }
      if(b.t==='cube' && d<R_CUBE && pp.hit[b.id]!==1){ pp.a+=180; const n=Math.atan2(pp.y-b.y,pp.x-b.x); pp.x=b.x+Math.cos(n)*(R_CUBE+2); pp.y=b.y+Math.sin(n)*(R_CUBE+2); pp.hit={}; pp.hit[b.id]=1; }
    }
    for(const w of solids) bounceRect(pp,w); // field border and level walls
    if(window.CAM) CAM.collide(pp); // physical white blocks: people bounce off them (BOUNCE.on) or walk around them
    if(pp.vz||pp.z>0){ // in the air: gravity; stop at the floor after this single jump
      pp.vz-=BOUNCE.gravity*dt; pp.z=(pp.z||0)+pp.vz*dt;
      if(pp.z<=0){ pp.z=0; pp.landAt=performance.now(); pp.vz=0; } }
    if(pp.squash>0) pp.squash=Math.max(0,pp.squash-dt*4);
    }
    for(const [k,cp] of Object.entries(cps)) if(!pp.seen[k] && atCheckpoint(pp,cp)){ pp.seen[k]=1; const Wv=pp.W;
      Wv.hits[k]=(Wv.hits[k]||0)+1; if(Wv===wave) cp.n=Wv.hits[k];
      if(!Wv.taken[k]&&Wv.hits[k]>=CP_NEED) takeCheckpoint(Wv,k); }
    if(inRect(pp.x,pp.y,Z.end.r)){ pp.gone=true; if(!isActive()) continue; /* inactief: niets tellen */ keepActive(); const st=pp.st||0; // everyone may finish; the fill state decides the points
      totals.out++; totals.fill[st]++; zoneArrived++; zoneFill[st]++; pp.W.stats.fill[st]++; totals.score+=FILL_PTS[st];
      if(st===2){ zoneFull++; tone(880+Math.random()*300,.05,'sine',.03); if(zoneFull===GOAL){ toast(`<i>${Z.end.ic}</i><div>Finish gehaald!<small>${GOAL} volle mensen aangekomen</small></div>`); tone(988,.2); } }
      checkGoal(); continue; }
    if(pp.x<-20||pp.x>W+20||pp.y<-40||pp.y>H+20){ pp.gone=true; if(!isActive()) continue; totals.stray++; totals.lost++; pp.W.stats.lost++; continue; } // missed the finish: counts as 'verdwaald'
  }
  people=people.filter(p=>!p.gone);
  if(celebrate>0){ celebrate-=dt; if(celebrate<=0){ celebrate=0; const n=(zi+1)%ZONES.length; if(n===0) round++; loadZone(n); toast(`<i>➡️</i>${ZONES[n].n}`); } }
  if(!isActive() && performance.now()-lastTouch>90000 && (zi!==0||blocks.length)){ /* no reset while a game is going on */ lastTouch=-1e9; round=1; totals=newTotals(); loadZone(0); }
}
function takeCheckpoint(Wv,k){ keepActive(); // CP_NEED people of wave Wv passed checkpoint k: the whole wave fills up
  Wv.taken[k]=1; if(Wv===wave) cps[k].done=true;
  const st=fillState(Object.keys(Wv.taken).length), now=performance.now();
  if(st!==Wv.st){ Wv.st=st; for(const q of people) if(q.W===Wv){ q.st=st; q.popAt=now; } fillSound(st); }
  if(waveToasts(Wv)) toast(`<i>✅</i><div>Checkpoint ${Object.keys(cps).indexOf(k)+1} gepakt<small>De persoon is nu ${FILL_NAMES[Wv.st]}</small></div>`);
  renderCases();
}
let fillSoundAt=0;
function fillSound(st){ const now=performance.now(); if(now-fillSoundAt<90) return; fillSoundAt=now; tone(st===2?784:587,.08,'sine',.035); }
function checkGoal(){ if(celebrate>0) return; if(zoneFull>=GOAL){ totals.arenas++; totals.score+=Math.max(0,Math.round(180-zoneT))*5; celebrate=3; tone(392,.3); } }

function wood(t,x,y,ang,lift){
  const [top,side,hi]=WOOD[t], Hh=12;
  ctx.fillStyle=`rgba(58,42,26,${.28-lift/300})`; ctx.beginPath();
  if(t==='bridge'){ ctx.save(); ctx.translate(x+4,y+Hh+lift); ctx.rotate(rad(ang)); ctx.fillRect(-PLANK_L/2,-PLANK_W/2,PLANK_L,PLANK_W); ctx.restore(); }
  else { ctx.ellipse(x+3,y+lift+Hh+6,30+lift/6,18,0,0,7); ctx.fill(); }
  ctx.save(); ctx.translate(x,y); ctx.rotate(rad(ang));
  if(t==='bridge'){ ctx.fillStyle=side; ctx.fillRect(-PLANK_L/2,-PLANK_W/2+Hh,PLANK_L,PLANK_W); ctx.fillStyle=top; ctx.fillRect(-PLANK_L/2,-PLANK_W/2,PLANK_L,PLANK_W); grain(ctx,-PLANK_L/2,-PLANK_W/2,PLANK_L,PLANK_W,'#8A6232'); ctx.fillStyle=hi; ctx.fillRect(-PLANK_L/2,-PLANK_W/2,PLANK_L,4); ctx.fillStyle='#8A6232'; [-PLANK_L/2+10,PLANK_L/2-10].forEach(u=>{ ctx.beginPath(); ctx.arc(u,0,3,0,7); ctx.fill(); }); }
  else if(t==='cube'){ ctx.rotate(-rad(ang)); ctx.fillStyle=side; ctx.beginPath(); ctx.roundRect(-22,-22+Hh,44,44,6); ctx.fill(); ctx.fillStyle=top; ctx.beginPath(); ctx.roundRect(-22,-22,44,44,6); ctx.fill(); grain(ctx,-22,-22,44,44,side); ctx.fillStyle=hi; ctx.fillRect(-17,-19,34,4); }
  else if(t==='split'){ ctx.rotate(-rad(ang)); ctx.fillStyle=side; ctx.beginPath(); ctx.ellipse(0,Hh,24,24,0,0,7); ctx.fill(); ctx.fillRect(-24,0,48,Hh); ctx.fillStyle=top; ctx.beginPath(); ctx.arc(0,0,24,0,7); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=2; [17,10,4].forEach(r=>{ ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke(); }); ctx.fillStyle=hi; ctx.beginPath(); ctx.arc(-8,-9,5,0,7); ctx.fill(); }
  else { const tri=(oy)=>{ ctx.beginPath(); ctx.moveTo(26,oy); ctx.lineTo(-20,-24+oy); ctx.lineTo(-20,24+oy); ctx.closePath(); };
    ctx.save(); ctx.rotate(-rad(ang)); ctx.translate(0,Hh); ctx.rotate(rad(ang)); ctx.fillStyle=side; tri(0); ctx.fill(); ctx.restore();
    ctx.fillStyle=top; tri(0); ctx.fill(); ctx.save(); tri(0); ctx.clip(); grain(ctx,-20,-24,46,48,side); ctx.restore(); ctx.strokeStyle=hi; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-17,-19); ctx.lineTo(-17,19); ctx.stroke(); }
  ctx.restore();
}
// The fill state is shown in the person itself, like a glass filling up from the feet:
// leeg = grey figure, halfvol = coloured up to the waist (top still grey), vol = fully coloured with a golden glow.
const EMPTY_LOOK={shirt:'#9AA3AE', skin:'#C3C9D1', hair:'#7D858F', legB:'#5E656E', legF:'#6B727C'};
const FILL_CUT=-1; // halfvol: everything below this height (sprite coordinates, 0 = middle of the body) is coloured
function person(pp){ // walking person seen from the side (faces right; the sprite is mirrored when walking left)
  const st=pp.st||0, full={shirt:pp.shirt, skin:pp.skin, hair:pp.hair, legB:'#2A2522', legF:'#3A2F2A'};
  ctx.save(); ctx.globalAlpha=Math.max(0,pp.alpha); ctx.translate(pp.x,pp.y);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,14.5,7,2,0,0,7); ctx.fill(); // floor shadow
  if(st===2){ const g=ctx.createRadialGradient(0,-2,2,0,-2,14); g.addColorStop(0,'rgba(255,201,60,.55)'); g.addColorStop(1,'rgba(255,201,60,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-2,14,0,7); ctx.fill(); } // vol: golden glow
  if(st<2) figure(pp,EMPTY_LOOK);                     // grey base (leeg, and the empty top of halfvol)
  if(st>0){ ctx.save(); if(st===1){ ctx.beginPath(); ctx.rect(-20,FILL_CUT,40,40); ctx.clip(); } figure(pp,full); ctx.restore(); }
  if(st===1){ ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-4,FILL_CUT); ctx.lineTo(4,FILL_CUT); ctx.stroke(); } // fill line
  ctx.restore();
}
function figure(pp,c){ // the person itself in the given colours (legs, arms, body, head)
  const sw=Math.sin(pp.ph)*.6, bob=-Math.abs(Math.cos(pp.ph))*1.2, lim=(x,y,ang,len)=>{ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.sin(ang)*len,y+Math.cos(ang)*len); ctx.stroke(); };
  ctx.save(); ctx.translate(0,bob); ctx.lineCap='round';
  ctx.strokeStyle=c.legB; ctx.lineWidth=3; lim(0,4,-sw,10);    // back leg
  ctx.strokeStyle=c.skin; ctx.lineWidth=2.4; lim(0,-4,sw,8);   // back arm
  ctx.strokeStyle=c.legF; ctx.lineWidth=3; lim(0,4,sw,10);     // front leg
  ctx.fillStyle=c.shirt; ctx.beginPath(); ctx.roundRect(-4,-7,8,12,3); ctx.fill(); // body
  ctx.strokeStyle=c.skin; ctx.lineWidth=2.4; lim(0,-4,-sw,8);  // front arm
  ctx.fillStyle=c.skin; ctx.beginPath(); ctx.arc(.5,-11,4.2,0,7); ctx.fill();
  ctx.fillStyle=c.hair; ctx.beginPath(); ctx.arc(.5,-11.5,4.3,Math.PI*.95,Math.PI*2.05); ctx.fill(); ctx.fillRect(-3.8,-12,2.2,4);
  ctx.fillStyle='#2A2522'; ctx.fillRect(2.4,-11.5,1.2,1.4); // eye: shows the walking direction
  ctx.lineCap='butt'; ctx.restore();
}
function drawWater(){ // fenced-off construction zone (static: part of the background texture)
  for(const [x,y,w,h] of Z.water){ // fenced-off construction zone
    ctx.fillStyle=PAL.zone; ctx.fillRect(x,y,w,h);
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    for(let i=0;i<w+h;i+=26){ ctx.fillStyle=(i/26)%2?'rgba(0,0,0,.06)':'rgba(255,255,255,.05)'; ctx.beginPath(); ctx.moveTo(x+i,y); ctx.lineTo(x+i+13,y); ctx.lineTo(x+i+13-h,y+h); ctx.lineTo(x+i-h,y+h); ctx.fill(); }
    const big=w>h; for(let k=0;k<(big?w:h)/140;k++){ const px=big?x+60+k*140:x+w/2, py=big?y+h/2:y+60+k*140; ctx.fillStyle='#B58A55'; ctx.fillRect(px-16,py-10,32,20); ctx.fillStyle='#FF8A00'; ctx.beginPath(); ctx.moveTo(px+28,py+10); ctx.lineTo(px+36,py-12); ctx.lineTo(px+44,py+10); ctx.fill(); }
    ctx.restore();
    ctx.lineWidth=8; ctx.setLineDash([16,16]); ctx.strokeStyle='#FFC800'; ctx.strokeRect(x,y,w,h); ctx.lineDashOffset=16; ctx.strokeStyle='#22252B'; ctx.strokeRect(x,y,w,h); ctx.setLineDash([]); ctx.lineDashOffset=0; }

<script>
// ===== Camera link: Python/OpenCV (camera_bridge.py) -> WebSocket -> canvas =====
// Optional: if the bridge is not running, the game plays normally and reconnects in the background.
// The white test object drives a cursor; the red and green chips act as blocks in the simulation.
//
// Coordinates: the bridge sends nx/ny as a fraction of the *camera frame*, not of the canvas. The canvas
// is only part of the monitor and the monitor only part of the camera frame, so nx*W squeezes the cursor
// into a small region. A 4-point calibration (press K, place the object on the four targets) yields a
// perspective transform camera (nx,ny) -> canvas (x,y) that also covers mirroring and rotation.
window.CAM=(()=>{
  const URL_='ws://127.0.0.1:8765', RETRY_MIN=1000, RETRY_MAX=8000, STALE=1500, LOST_GRACE=250, FADE_MS=1200;
  // Calibration targets are inset so the whole object fits on the canvas; the transform extrapolates to the edges.
  const CAL_KEY='pm-camera-calibration-v1', CAL_INSET=.15, CAL_HOLD=900, CAL_STILL=.012, CAL_MOVE=.05, OFF_CANVAS=60;
  // Cursor ring radius in screen pixels. It must lie just outside the physical object, otherwise the object
  // hides it. The default fits an AirPods case on a ~24" monitor; override with index.html?camring=180.
  const RING_PX=Math.min(400,Math.max(30,+(location.search.match(/[?&]camring=(\d+)/)||[])[1]||150));
  let ws=null, retryT=null, retryMs=RETRY_MIN, connected=false, lastMsg=0, lastSeen=0, objs=[], cur=null, lastDraw=0, failed=false, warned=false, raw=null;
  let cal=null, calib=null, ringR=100;

  // The bridge reports each chip with kind, position, rim point (size) and, for the red chip, the yellow
  // segment as heading point. Each chip becomes a real block in the existing simulation:
  //   redirect (red)  -> 'arrow' block: people walk on in the direction of the yellow segment
  //   split    (green)-> 'split' block: people turn into one of two branches, relative to their own walking
  //                       direction (same rule as the wooden roll). Edit turns/ratio below to change it.
  // Colors of the camera visuals: saturated blue (never white/red/yellow/green: those are detection colors).
  const VIS=DARK?{line:'#3D8BFF',shade:'rgba(5,10,20,.6)',held:'#6B7686'}:{line:'#2F7FD1',shade:'rgba(34,52,79,.45)',held:'#9AA3AF'};

  const CHIP_GRACE=2000, CHIP_PAD=6, CHIP_POS_DB=4, CHIP_ANG_DB=4; // ms kept after loss; trigger margin; dead bands (canvas px / degrees)

  const WALL={pad:6, name:'wit blok'}; // pad: half the width of a person (canvas units)
  const walls=new Map(); // bridge id -> {x, y, hw, hh, ar (radians), cs, sn, seen, held}
  let wallsVer=0; // goes up whenever a wall appears, moves or disappears (the flow field is rebuilt then)
  const angDiff=(a,b)=>Math.abs(((a-b)%360+540)%360-180);

  const BRIDGE_KEYS=['[',']','-','=','+',',','.','a','A','b','B'];
  let expoAsked=0, expoShown='';
  let debug=/[?&]camdebug\b/.test(location.search); // open index.html?camdebug to show raw coordinates on the canvas
  const listeners=new Set(), el=$('camStatus');
  const LABEL={off:'Camera niet verbonden',on:'Camera verbonden',seen:'Camera verbonden · object in beeld',cal:'Camera kalibreren…'};
  const LABEL_UNCAL={on:'Camera verbonden · niet gekalibreerd (K)',seen:'Object in beeld · niet gekalibreerd (K)'};
  function status(s){ let txt=(!cal&&LABEL_UNCAL[s])||LABEL[s];

  const num=v=>typeof v==='number'&&Number.isFinite(v), c01=v=>Math.min(1,Math.max(0,v));

  const inRange=(nx,ny)=>{ const ok=num(nx)&&num(ny)&&nx>=-.02&&nx<=1.02&&ny>=-.02&&ny<=1.02;
    if(!ok&&num(nx)&&num(ny)&&!warned){ warned=true; console.warn('[camera] coördinaten buiten 0..1 genegeerd (pixels in plaats van genormaliseerd?):',nx,ny); } return ok; };

  // ---- Perspective transform (4 point pairs, h33 = 1) ----
  function solveH(src,dst){
    const A=[], b=[];
    for(let i=0;i<4;i++){ const [x,y]=src[i], [u,v]=dst[i];
      A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u); A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v); }

      let p=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
      if(Math.abs(A[p][c])<1e-12) return null;

  function makeCal(pts){ // null if the four camera points do not form a usable (convex, large enough) quad
    const cross=[0,1,2,3].map(i=>{ const [a,b,c]=[pts[i],pts[(i+1)%4],pts[(i+2)%4]]; return (b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]); });

    const h=solveH(pts,targets()); if(!h||!h.every(Number.isFinite)) return null;
    const sign=Math.sign(hw(h,pts[0][0],pts[0][1]));

  // ---- Multi-point calibration (automatic, K): least-squares perspective + correction for lens curvature ----
  function solveLin(A,b){ const n=b.length, M=A.map((r,i)=>[...r,b[i]]);

      if(Math.abs(M[p][c])<1e-12) return null; [M[c],M[p]]=[M[p],M[c]];
      for(let r=0;r<n;r++) if(r!==c){ const f=M[r][c]/M[c][c]; for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; } }

  function fitH(cam,canv){ // least-squares perspective transform (more than 4 points)

    const sign=Math.sign(hw(h,cam[0][0],cam[0][1])); if(!sign||!cam.every(([x,y])=>hw(h,x,y)*sign>0)) return null;

  // With only the 4 corners the perspective fits them exactly, so the corners alone cannot reveal lens curvature.
  // The outline of the lit field can: on the screen its sides are straight lines (x=0, x=W, y=0, y=H). The lens
  // (k1/k2) is chosen so the mapped outline is as straight as possible (spread per side; a uniform glow that
  // shifts a whole side does not matter). Points near the rounded canvas corners are left out.
  function edgeSides(base,edges){ const out=[];
    for(const p of edges){ const q=applyCal(base,p[0],p[1]); if(!q) continue;
      const d=[Math.abs(q[0]),Math.abs(W-q[0]),Math.abs(q[1]),Math.abs(H-q[1])], side=d.indexOf(Math.min(...d));

    let s=0,n=0; for(const a of v){ if(a.length<5) continue; const m=a.reduce((x,y)=>x+y,0)/a.length; for(const x of a){ s+=(x-m)**2; n++; } }

  function fitCal(cam,canv,aspect,edges){

  function loadCal(){ try{ const c=JSON.parse(localStorage.getItem(CAL_KEY)||'null');

  function toCanvas(nx,ny){
    if(!cal) return [c01(nx)*W, c01(ny)*H]; // uncalibrated: whole camera frame = canvas

    if(!p||p[0]<-OFF_CANVAS||p[0]>W+OFF_CANVAS||p[1]<-OFF_CANVAS||p[1]>H+OFF_CANVAS) return null; // object lies next to the playfield

  }

  function mapRaw(nx,ny){ return cal?applyCal(cal,nx,ny):[nx*W,ny*H]; } // helper points (rim, heading): no clamping

  // ---- Calibration: hold the object still on each target; the averaged raw position is recorded ----
  function startCal(){ calib={pts:[],buf:[],seen:false,near:false}; cur=null; console.info('[camera] kalibratie gestart'); }

  // Independent check of a calibration: the outline of the lit field must land on the canvas edges.

  function acalTick(now){ const s=calib; if(!s||!s.auto) return;

  function onCalMsg(m){ const s=calib, now=performance.now(); if(!s||!s.auto) return;

  function drawAutoCal(c){ const s=calib;

  function calSample(o){
    const s=calib, now=performance.now();
